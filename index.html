<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelkreide · Lern-Apps</title>
<meta name="description" content="Interaktive Lern-Apps, mit KI gebaut. Direkt im Browser ausprobieren, inklusive Prompt zum Nachbauen.">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/pixelkreide.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <img class="logo" src="assets/logo.png" alt="Pixelkreide">
    <div>
      <span class="chip">LERN-APPS</span>
      <h1>Lernen mit <span class="grad">Pixelkreide</span></h1>
      <p class="hand">Anklicken, ausprobieren, nachbauen.</p>
    </div>
  </div>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="App suchen …" aria-label="App suchen">
  <div class="filters" id="filters"></div>
</div>

<main class="grid" id="list"></main>

<footer>Alle Apps laufen direkt im Browser · Keine Anmeldung nötig · <a href="https://mein.online-impressum.de/pixelkreide" target="_blank" rel="noopener">Impressum &amp; Datenschutz</a></footer>

<script>
/* ============================================================
   Neue App eintragen: ein Objekt in diese Liste setzen.
   datei  = Pfad zur HTML-Datei (z. B. "apps/epochen-detektiv.html")
   prompt = optional: Seite mit dem Prompt (z. B. "prompts/epochen-detektiv.html")
   fach   = Fach (daraus entstehen die Filter-Buttons automatisch)
   stufe  = Jahrgangsstufe (optional)
   ============================================================ */
const APPS = [
  { titel: "Chemielabor 3D", beschreibung: "Ein unbekanntes Salz mit eigenen Versuchen bestimmen: Brenner, Reagenzgläser, Nachweise.", fach: "Chemie", datei: "apps/chemielabor-3d.html", prompt: "prompts/chemielabor-3d.html" },
  { titel: "Chemische Uhr 3D", beschreibung: "Eine oszillierende Reaktion in 3D auslösen und beobachten.", fach: "Chemie", datei: "apps/chemische-uhr-3d.html" },
  { titel: "Handlabor Moleküle", beschreibung: "Moleküle mit bloßen Händen vor der Kamera drehen und erkunden.", fach: "Chemie", datei: "apps/handlabor-molekuele.html", prompt: "prompts/handlabor-molekuele.html" },
  { titel: "DNA-Replikation 3D", beschreibung: "Die Kopiermaschine des Lebens, Atom für Atom, mit allen Enzymen.", fach: "Biologie", datei: "apps/dna-replikation-3d.html", prompt: "prompts/dna-replikation-3d.html" },
  { titel: "Ribosom 3D", beschreibung: "Wie aus einer Gensequenz Hämoglobin wird: Translation zum Mitverfolgen.", fach: "Biologie", datei: "apps/ribosom-3d.html", prompt: "prompts/ribosom-3d.html" },
  { titel: "Synapse 3D", beschreibung: "Wie ein Nerv den Muskel erreicht, Molekül für Molekül.", fach: "Biologie", datei: "apps/synapse-3d.html" },
  { titel: "Photosynthese-Labor", beschreibung: "Vom Licht zum Zucker: Versuche verändern, Wirkung beobachten, ins Blatt schauen.", fach: "Biologie", datei: "apps/photosynthese-labor.html" },
  { titel: "Fadenstrahlrohr 3D", beschreibung: "Elektronen im Magnetfeld sichtbar machen und die spezifische Ladung bestimmen.", fach: "Physik", datei: "apps/fadenstrahlrohr-3d.html", prompt: "prompts/fadenstrahlrohr-3d.html" },
  { titel: "Federpendel 3D", beschreibung: "Gewicht auslenken, Kräfte einblenden, Schwingung in Zeitlupe analysieren.", fach: "Physik", datei: "apps/federpendel-3d.html", prompt: "prompts/federpendel-3d.html" },
  { titel: "Stoßlabor 3D", beschreibung: "Impuls und Energie mit echter Physik-Engine untersuchen.", fach: "Physik", datei: "apps/stosslabor-3d.html", prompt: "prompts/stosslabor-3d.html" },
  { titel: "Teslaspule 3D", beschreibung: "Zwei Schwingkreise, ein Takt, hunderttausend Volt: die singende Teslaspule.", fach: "Physik", datei: "apps/teslaspule-3d.html", prompt: "prompts/teslaspule-3d.html" },
  { titel: "Schwarzes Loch 3D", beschreibung: "Anflug auf ein Schwarzes Loch mit Lichtablenkung und Doppler-Effekt.", fach: "Physik", datei: "apps/schwarzes-loch-3d.html" },
  { titel: "Zugversuch", beschreibung: "Spannungs-Dehnungs-Diagramm live: Probe ziehen, Bereiche und Kennwerte bestimmen.", fach: "Technik", datei: "apps/zugversuch.html", prompt: "prompts/zugversuch.html" },
  { titel: "Ableitung und Integral", beschreibung: "Vom Grenzwert zum Hauptsatz, interaktiv erklärt.", fach: "Mathematik", datei: "apps/ableitung-integral.html", prompt: "prompts/ableitung-integral.html" },
  { titel: "Warum ist die Ableitung von x² gleich 2x?", beschreibung: "Erklärvideo, das dreimal anhält und dir eine Frage stellt.", fach: "Mathematik", datei: "apps/ableitung-x2-video.html" },
  { titel: "Die Mitternachtsformel", beschreibung: "Quadratische Gleichungen Schritt für Schritt lösen.", fach: "Mathematik", datei: "apps/mitternachtsformel.html" },
  { titel: "Neuronales Netz", beschreibung: "Ein Netz trainieren, Muster trennen und eigene Ziffern erkennen lassen.", fach: "Informatik", datei: "apps/neuronales-netz.html" },
  { titel: "Marktsimulation", beschreibung: "Käufer und Verkäufer in echtem Python, direkt im Browser.", fach: "Wirtschaft", datei: "apps/marktsimulation-python.html" },
  { titel: "Europas Grenzen", beschreibung: "Von den Imperien bis nach dem Kalten Krieg: Karten lesen und vergleichen.", fach: "Geschichte", datei: "apps/europas-grenzen.html" },
  { titel: "Museum der Perspektive", beschreibung: "Durch ein 3D-Museum gehen und erleben, wie Maler den Raum erfanden.", fach: "Kunst", datei: "apps/museum-perspektive.html" },
  { titel: "Pixel-Leben", beschreibung: "Ein Pixel-Art-Spiel über Bindung, Identität und Selbstwirksamkeit.", fach: "Pädagogik/Psychologie", datei: "apps/pixel-leben.html", prompt: "prompts/pixel-leben.html" },
  { titel: "Reiz & Reaktion", beschreibung: "Eine Pixel-Art-Zeitreise zu Pawlow, Watson, Skinner und Bandura.", fach: "Pädagogik/Psychologie", datei: "apps/reiz-und-reaktion.html", prompt: "prompts/reiz-und-reaktion.html" },
  { titel: "Skinner-Box", beschreibung: "Eine virtuelle Ratte trainieren und Verstärkerpläne vergleichen.", fach: "Pädagogik/Psychologie", datei: "apps/skinner-box.html", prompt: "prompts/skinner-box.html" },
  { titel: "Mondnacht", beschreibung: "Eine Reise in die Romantik: auf der Suche nach der blauen Blume.", fach: "Deutsch", datei: "apps/mondnacht-nebelwald.html" },
  { titel: "Die graue Stadt (AR)", beschreibung: "AR-Arbeitsblatt zu Theodor Storms „Die Stadt“, mit Cardboard-Brillenmodus.", fach: "Deutsch", datei: "apps/die-graue-stadt-ar.html", prompt: "prompts/die-graue-stadt-ar.html" },
  { titel: "Vokalviereck Englisch", beschreibung: "Ins Mikrofon sprechen und sehen, wo deine englischen Vokale landen.", fach: "Englisch", datei: "apps/vokalviereck-englisch.html", prompt: "prompts/vokalviereck-englisch.html" },
  { titel: "Vokalviereck Französisch", beschreibung: "Ins Mikrofon sprechen und sehen, wo deine französischen Vokale landen.", fach: "Französisch", datei: "apps/vokalviereck-franzoesisch.html" },
];

const FARBEN = ['--cyan', '--violet', '--yellow', '--pink', '--green'];
const list = document.getElementById('list');
const q = document.getElementById('q');
const filtersEl = document.getElementById('filters');
let fach = 'Alle';

const faecher = [...new Set(APPS.map(a => a.fach).filter(Boolean))].sort();
const farbe = f => `var(${FARBEN[faecher.indexOf(f) % FARBEN.length]})`;

['Alle', ...faecher].forEach(f => {
  const b = document.createElement('button');
  b.className = 'filter';
  b.textContent = f;
  b.setAttribute('aria-pressed', f === fach);
  b.onclick = () => {
    fach = f;
    filtersEl.querySelectorAll('.filter').forEach(c => c.setAttribute('aria-pressed', c.textContent === fach));
    render();
  };
  filtersEl.appendChild(b);
});
if (faecher.length < 2) filtersEl.style.display = 'none';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  const term = q.value.trim().toLowerCase();
  const items = APPS.filter(a =>
    (fach === 'Alle' || a.fach === fach) &&
    (!term || [a.titel, a.beschreibung, a.fach].join(' ').toLowerCase().includes(term))
  );
  if (!items.length) {
    list.innerHTML = `<div class="empty"><p class="hand">${APPS.length ? 'Keine passende App gefunden.' : 'Hier erscheinen bald die ersten Apps.'}</p></div>`;
    return;
  }
  list.innerHTML = items.map(a => `
    <article class="card">
      <h2><a href="${esc(a.datei)}">${esc(a.titel)}</a></h2>
      <p>${esc(a.beschreibung)}</p>
      <div class="meta">
        ${a.fach ? `<span class="tag" style="color:${farbe(a.fach)}">${esc(a.fach)}</span>` : ''}
        ${a.stufe ? `<span class="tag" style="color:var(--muted)">Jgst. ${esc(a.stufe)}</span>` : ''}
        <span class="links">
          ${a.prompt ? `<a class="p" href="${esc(a.prompt)}">Prompt</a>` : ''}
          <a href="${esc(a.datei)}">Starten ▸</a>
        </span>
      </div>
    </article>`).join('');
}

q.addEventListener('input', render);
render();
</script>
</body>
</html>
