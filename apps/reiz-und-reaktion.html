<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#040408;overflow:hidden;color:#efe6d4;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none}

#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .9s}

  padding:.9em 1.3em 1.1em;min-height:5.2em;opacity:0;transform:translateY(.6em);transition:opacity .3s,transform .3s;pointer-events:none;cursor:pointer}

.pc .sub{font-size:.75em;letter-spacing:.25em;text-transform:uppercase;color:var(--ac,#c9b27a);margin-bottom:.6em}

.op{font-weight:700;color:var(--ac,#c9b27a)}
.row{display:flex;gap:.6em;flex-wrap:wrap;margin:.6em 0}

.btn:hover{background:rgba(255,255,255,.08)}

.btn:disabled{opacity:.35;cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:.45em;min-height:2.4em;padding:.5em;border:1px dashed rgba(255,255,255,.15);margin:.5em 0}
.card{background:#1d1f2c;border:1px solid rgba(255,255,255,.2);padding:.4em .65em;font-size:.84em;cursor:pointer;border-radius:2px;line-height:1.3;max-width:100%}
.card:hover{border-color:var(--ac,#c9b27a)}
.card.sel{outline:2px solid var(--ac,#c9b27a);background:#2a2c3c}

.card.bad{border-color:#e0605a;background:#3a1717;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.slots{display:grid;gap:.5em;margin:.5em 0}

.slot .lb{font-size:.74em;letter-spacing:.06em;opacity:.8;margin-bottom:.35em;font-weight:600}
.slot .hn{font-size:.7em;opacity:.6;font-style:italic;display:none;margin-top:-.2em;margin-bottom:.3em}
.hints .slot .hn{display:block}
.slot .in{display:flex;flex-wrap:wrap;gap:.35em}
.opts{display:grid;gap:.45em;margin:.6em 0}

.opt.ok{border-color:#7fd17a;background:#17301a}

.opt.on{outline:2px solid var(--ac,#c9b27a)}
.fb{margin:.5em 0;padding:.55em .8em;font-size:.84em;line-height:1.45;border-left:3px solid #7fd17a;background:rgba(127,209,122,.08);display:none}
.fb.bad{border-color:#e0605a;background:rgba(224,96,90,.08)}

.simc{width:100%;image-rendering:pixelated;display:block;border:1px solid rgba(255,255,255,.1);background:#000}

.two{display:grid;grid-template-columns:1.25fr 1fr;gap:1em;align-items:start}
.tag{display:inline-block;font-size:.68em;letter-spacing:.15em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);padding:.05em .45em;margin-right:.4em;opacity:.8}
textarea{width:100%;min-height:6em;background:#0c0d14;border:1px solid rgba(255,255,255,.2);color:#efe6d4;font:inherit;font-size:.88em;padding:.6em;resize:vertical}

.mus.on{display:block}
.chk{font-size:.84em;line-height:1.6}
.chk label{display:block;cursor:pointer}
/* book */
.bk{width:70%;max-height:86%;overflow:auto;background:#e9dfc8;color:#2a2118;padding:1.3em 1.6em;border-radius:2px;box-shadow:0 1em 4em #000, inset 0 0 4em rgba(120,90,40,.25);font-family:"Palatino Linotype",Palatino,Georgia,serif}

.bk .en{border-top:1px solid rgba(80,60,30,.25);padding:.5em 0}
.bk .en b{display:block;font-size:.95em}
.bk .en span{font-size:.85em;line-height:1.45}
.bk .ch{font-size:.7em;letter-spacing:.2em;text-transform:uppercase;color:#8a6a3a;margin-top:.8em}

/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.2s;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.75))}
#title .k{letter-spacing:.6em;font-size:.8em;opacity:.7;text-transform:uppercase}
#title h1{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-weight:normal;font-size:4.2em;margin:.1em 0 .05em;letter-spacing:.06em;color:#f6ecd6;text-shadow:0 0 .5em rgba(226,166,75,.45),0 .1em .4em #000}
#title h1 span{color:#e2a64b}
#title .s{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-style:italic;font-size:1.15em;opacity:.85;margin-bottom:1.6em}
#title .ctl{font-size:.72em;opacity:.55;margin-top:1.4em;line-height:1.7}
#title .btn{font-size:1em;padding:.6em 1.6em;letter-spacing:.15em;text-transform:uppercase}
</style>
</head>

<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud" style="opacity:0"><div id="obj"><b>Ziel</b><span id="objt"></span></div>
    <div id="btns"><button class="hb" id="bBook">📖 Notizbuch <span style="opacity:.5">N</span></button><button class="hb" id="bSnd">♪ Ton an</button><button class="hb" id="bHub">⌂ Archiv</button></div></div>
  <div id="prompt"></div>
  <div id="cap"><div class="k" id="capk"></div><div class="t serif" id="capt"></div><div class="p" id="capp"></div></div>

  </div>

<script>
"use strict";
/* ================= Grundlagen ================= */
const W=480,H=270;
const cv=document.getElementById('cv'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const wrap=$('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.width=(W*s)+'px';wrap.style.height=(H*s)+'px';wrap.style.fontSize=(s*5.3)+'px';}
addEventListener('resize',fit);fit();

function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(h,a=.25){const[r,g,b]=hx(h);return toHex(r*(1-a),g*(1-a),b*(1-a));}
function tint(h,a=.25){const[r,g,b]=hx(h);return toHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);}
function mixc(a,b,t){const A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t);}
function rgba(h,a){const[r,g,b]=hx(h);return`rgba(${r},${g},${b},${a})`;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function vgrad(c,x,y,w,h,st){
  for(let j=0;j<h;j++){
    const t=h>1?j/(h-1)*(st.length-1):0;const i=Math.min(st.length-2,Math.floor(t));const f=t-i;const row=BAYER[(y+j)&3];
    let rs=0,rc=null;
    for(let k=0;k<=w;k++){let col=null;if(k<w){const th=(row[(x+k)&3]+.5)/16;col=f>th?st[i+1]:st[i];}
      if(col!==rc){if(rc){c.fillStyle=rc;c.fillRect(x+rs,y+j,k-rs,1);}rc=col;rs=k;}}
  }
}
function hgrad(c,x,y,w,h,st){
  for(let k=0;k<w;k++){const t=w>1?k/(w-1)*(st.length-1):0;const i=Math.min(st.length-2,Math.floor(t));const f=t-i;
    for(let j=0;j<h;j++){const th=(BAYER[(y+j)&3][(x+k)&3]+.5)/16;c.fillStyle=f>th?st[i+1]:st[i];c.fillRect(x+k,y+j,1,1);}}
}
function speck(c,x,y,w,h,col,n,r){for(let i=0;i<n;i++)R(c,x+r()*w,y+r()*h,1,1,col);}
function glow(c,x,y,r,col,a){if(r<=0||a<=0)return;c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();}
function shadowBlob(c,x,y,rx,ry,a){c.save();c.fillStyle=`rgba(0,0,0,${a})`;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();c.restore();}
function beam(c,pts,col,a,y0,y1){c.save();c.globalCompositeOperation='lighter';const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))c.lineTo(p[0],p[1]);c.closePath();c.fill();c.restore();}
function line(c,x0,y0,x1,y1,col){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;c.fillStyle=col;for(let i=0;i<2000;i++){c.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function arch(c,cx,top,w,h,col){const r=w/2;for(let j=0;j<h;j++){let hw=r;if(j<r){const d=r-j-.5;hw=Math.sqrt(Math.max(0,r*r-d*d));}hw=Math.round(hw);c.fillStyle=col;c.fillRect(Math.round(cx-hw),top+j,hw*2,1);}}
function ellipseFill(c,cx,cy,rx,ry,col){c.fillStyle=col;for(let j=-ry;j<=ry;j++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(j*j)/(ry*ry))));c.fillRect(Math.round(cx-hw),Math.round(cy+j),hw*2,1);}}
const DIG={0:['111','101','101','101','111'],1:['010','110','010','010','111'],2:['111','001','111','100','111'],3:['111','001','111','001','111'],4:['101','101','111','001','001'],5:['111','100','111','001','111'],6:['111','100','111','101','111'],7:['111','001','010','010','010'],8:['111','101','111','101','111'],9:['111','101','111','001','111'],'-':['000','000','111','000','000'],'?':['111','001','011','000','010']};
function digits(c,s,x,y,col){for(const ch of String(s)){const g=DIG[ch];if(g)for(let j=0;j<5;j++)for(let i=0;i<3;i++)if(g[j][i]==='1')R(c,x+i,y+j,1,1,col);x+=4;}}
function scribble(c,x,y,w,rows,col,r){for(let j=0;j<rows;j++){let px=x;const len=w*(.5+r()*.5);while(px<x+len){const sw=2+Math.floor(r()*5);for(let i=0;i<sw;i++)if(r()>.25)R(c,px+i,y+j*5+(r()>.7?1:0),1,1,col);px+=sw+2;}}}

/* ================= Figuren ================= */
function human(c,x,y,o,t){
  t=t||0;const f=o.face||1,kid=!!o.kid;
  const legH=kid?6:10,torH=kid?8:11,hdH=kid?7:8,tw=kid?8:10,hw=kid?7:8;
  const s=o.walk?Math.sin(o.walk):0;x=Math.round(x);y=Math.round(y);
  const breath=o.walk?0:Math.round((Math.sin(t*1.7+(o.ph||0))+1)*.5*.6);
  shadowBlob(c,x,y,8,2,.35);
  const yL=y-legH-2,l1=Math.round(s*2),l2=-l1;
  const pD=shade(o.pants,.3);
  if(o.skirt){R(c,x-3,yL+3,2,legH-3,o.skin);R(c,x+1,yL+3,2,legH-3,shade(o.skin,.15));}
  else{R(c,x-4+l1,yL,3,legH,f>0?pD:o.pants);R(c,x+1+l2,yL,3,legH,f>0?o.pants:pD);}
  const sh=o.shoes||'#1a1410';R(c,x-4+l1+(f>0?0:-1),y-2,4,2,sh);R(c,x+1+l2+(f>0?0:-1),y-2,4,2,sh);
  const ty=yL-torH+breath;
  // hinterer Arm
  const a=Math.round(s*2);const back=f>0?x-tw/2-2:x+tw/2;const front=f>0?x+tw/2:x-tw/2-2;
  const sl=o.sleeve||o.top;
  if(!o.armUp)R(c,back,ty+1+(-a>0?0:0),2,kid?7:9,shade(sl,.35));
  R(c,x-tw/2,ty,tw,torH+1-breath,o.top);
  if(o.skirt)R(c,x-tw/2-1,ty+torH-1,tw+2,5,o.skirt);
  if(o.coat){R(c,x-tw/2,ty+torH,tw,o.coat,o.top);R(c,f>0?x-tw/2:x+tw/2-2,ty+torH,2,o.coat,shade(o.top,.3));}
  R(c,f>0?x-tw/2:x+tw/2-2,ty,2,torH+1,shade(o.top,.3));
  if(o.rim)R(c,f>0?x+tw/2-1:x-tw/2,ty+1,1,torH-1,o.rim);
  if(o.shirt)R(c,x-1,ty,3,3,o.shirt);
  if(o.tie)R(c,x,ty+1,1,6,o.tie);
  if(o.scarf){R(c,x-tw/2,ty,tw,2,o.scarf);const tl=Math.round(Math.sin(t*3)*1);R(c,f>0?x-tw/2-2:x+tw/2,ty+1+tl,3,5,o.scarf);R(c,f>0?x-tw/2-3:x+tw/2+1,ty+5+tl,2,3,shade(o.scarf,.25));}
  // vorderer Arm
  if(o.armUp){R(c,front,ty-6,2,8,sl);R(c,front,ty-8,2,2,o.skin);if(o.hold)o.hold(c,front,ty-8);}
  else{R(c,front,ty+1+a,2,kid?6:8,sl);R(c,front,ty+(kid?7:9)+a,2,2,o.skin);if(o.hold)o.hold(c,front,ty+(kid?7:9)+a);}
  // Kopf
  const hy=ty-hdH,hX=x-hw/2;
  R(c,x-1,hy+hdH-1,3,2,shade(o.skin,.2));
  R(c,hX,hy,hw,hdH,o.skin);R(c,f>0?hX:hX+hw-1,hy+1,1,hdH-2,shade(o.skin,.18));
  const hr=o.hair;
  if(o.hs==='bald'){R(c,f>0?hX:hX+hw-2,hy+2,2,3,hr);R(c,hX,hy+1,hw,1,shade(o.skin,.08));}
  else if(o.hs==='long'){R(c,hX-1,hy-1,hw+2,3,hr);R(c,f>0?hX-1:hX+hw-2,hy,3,hdH+3,hr);}

  openPanel(head(o.title,o.sub)+(o.scene?`<p style="opacity:.85">${o.scene}</p>`:'')+`<p><b>${o.q}</b> <span style="opacity:.6;font-size:.85em">(mehrere Antworten möglich)</span></p><div class="opts">`+ops.map((x,i)=>`<button class="opt" data-i="${i}">${x.t}</button>`).join('')+`</div><div class="fb" id="fb"></div><div class="row"><button class="btn pri" id="chk">Prüfen</button><button class="btn" id="nx" style="display:none">Weiter ▶</button></div>`);
  const on=new Set();pc.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if($('nx').style.display==='')return;const i=+b.dataset.i;b.classList.remove('ok','bad');if(on.has(i)){on.delete(i);b.classList.remove('on');}else{on.add(i);b.classList.add('on');}AU.click();});
  $('chk').onclick=()=>{const fb=$('fb');let bad=0;ops.forEach((x,i)=>{if(!!x.ok!==on.has(i))bad++;});
    if(bad){first=false;AU.wrong();fb.className='fb bad on';fb.innerHTML=`<b>Noch nicht ganz</b> – ${bad} ${bad===1?'Antwort ist':'Antworten sind'} falsch gewählt oder fehlen. ${o.hint||''}`;}
    else{AU.chime();scoreIt(first);pc.querySelectorAll('.opt').forEach(b=>{const x=ops[+b.dataset.i];b.classList.remove('on');b.classList.add(x.ok?'ok':'bad');if(!x.ok)b.style.opacity=.5;});fb.className='fb on';fb.innerHTML=(first?'<b>Perfekt!</b> ':'<b>Jetzt stimmt es.</b> ')+o.why;$('chk').style.display='none';$('nx').style.display='';(o.notes||[]).forEach(note);}};
  $('nx').onclick=()=>done();
};}
function pInfo(o){return done=>{openPanel(head(o.title,o.sub)+o.html+`<div class="row"><button class="btn pri" id="nx">${o.btn||'Weiter ▶'}</button></div>`);(o.notes||[]).forEach(note);$('nx').onclick=()=>done();};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= Simulationen ================= */
let SIM=null;function stopSim(){if(SIM){SIM.stop=true;SIM=null;}}
function simLoop(sim){SIM=sim;let last=performance.now();const f=now=>{if(sim.stop)return;const dt=Math.min(.05,(now-last)/1000);last=now;sim.t+=dt;sim.update&&sim.update(dt);sim.draw();requestAnimationFrame(f);};requestAnimationFrame(f);}

/* ---- Pawlow ---- */
function simPavlov(done){
  openPanel(head('Der Versuch','Kapitel I · Laborprotokoll')+`<div class="two"><div><canvas class="simc" id="sc" width="240" height="140"></canvas>
   <div class="row"><button class="btn" id="b1">🔔 Glocke allein</button><button class="btn" id="b2">🥩 Futter allein</button><button class="btn" id="b3">🔔→🥩 Glocke, dann Futter</button><button class="btn" id="b4" style="display:none">🌙 Eine Nacht vergeht</button></div></div>
   <div><p>Du führst den Versuch durch. Jede Balkensäule unten im Bild ist ein Durchgang: Sie zeigt, wie viel Speichel der Hund absondert.</p>
   <ul class="goals"><li id="g1" class="cur">Konditioniere den Hund: Die <b>Glocke allein</b> soll mindestens 70 % Speichelfluss auslösen.</li><li id="g2">Lösche die Reaktion wieder: Läute die Glocke allein, bis weniger als 20 % übrig sind.</li><li id="g3">Lass eine Nacht vergehen und teste die Glocke erneut.</li></ul>
   <div class="log" id="log">Tipp: Teste die Glocke zuerst einmal allein. Was macht der Hund?</div><div class="row"><button class="btn pri" id="fin" style="display:none">Zur Auswertung ▶</button></div></div></div>`);
  const sc=$('sc'),c=sc.getContext('2d');c.imageSmoothingEnabled=false;
  const st={V:0,peak:0,trials:[],anim:null,g:0,pairs:0,night:false,t:0};
  const log=h=>$('log').innerHTML=h;
  const btns=['b1','b2','b3','b4'].map($);const dis=v=>btns.forEach(b=>b.disabled=v);
  function trial(kind){if(st.anim)return;dis(true);st.anim={kind,t:0,resp:0,logged:false};
    if(kind!=='food')AU.bell();}
  $('b1').onclick=()=>trial('bell');$('b2').onclick=()=>trial('food');$('b3').onclick=()=>trial('pair');
  $('b4').onclick=()=>{$('b4').style.display='none';st.night=true;st.V=Math.min(1,st.V+.55*(st.peak*.8-st.V));log('🌙 Die Nacht vergeht. Der Hund ruht sich aus … Läute morgen früh die Glocke allein.');AU.tone(220,1.2,'sine',.06);};
  $('fin').onclick=()=>done();
  const sim={t:0,update(dt){const a=st.anim;if(!a)return;a.t+=dt;
      if(a.kind==='bell'&&a.t>.5&&!a.logged){a.resp=Math.max(.03,Math.min(1,st.V*(.93+Math.random()*.12)));a.logged=true;}
      if(a.kind==='food'&&a.t>.6&&!a.logged){a.resp=1;a.logged=true;AU.plop();}
      if(a.kind==='pair'){if(a.t>.5&&a.resp<st.V){a.resp=Math.max(.03,st.V);}if(a.t>.9&&!a.logged){a.resp=1;a.logged=true;AU.plop();}}
      if(a.t>2.1){finish(a);st.anim=null;dis(false);}
    },draw(){drawP();}};
  function finish(a){const r=a.resp;st.trials.push({k:a.kind,r});if(st.trials.length>18)st.trials.shift();const n=st.trials.length;const pct=Math.round(r*100);
    if(a.kind==='pair'){st.V+=.28*(1-st.V);st.peak=Math.max(st.peak,st.V);st.pairs++;
      log(`Kopplung Nr. ${st.pairs}: Die Glocke kündigt das Futter an. Speichel ${pct} % – ausgelöst vom Futter (<span class="op">UCS → UCR</span>).`+(st.pairs>=4&&st.g===0?' <br><b>Teste jetzt die Glocke allein!</b>':''));note('kont');}
    else if(a.kind==='food'){log(`Futter allein: Speichel 100 %. Angeboren – <span class="op">unbedingter Reiz → unbedingte Reaktion</span>. Über die Glocke lernt der Hund dabei aber nichts.`);note('ucs');note('ucr');}
    else{ // bell
      if(st.g===0){if(r>=.7){st.g=1;mark('g1','g2');log(`<b>Glocke allein: ${pct} % Speichel!</b> Der Hund reagiert auf den Ton. Die Glocke ist zum <span class="op">bedingten Reiz (CS)</span> geworden, der Speichelfluss ist jetzt eine <span class="op">bedingte Reaktion (CR)</span>.`);note('cs');note('cr');AU.chime();}
        else if(st.pairs===0){log(`Glocke allein: ${pct} %. Der Hund spitzt nur die Ohren – eine Orientierungsreaktion. Die Glocke ist ein <span class="op">neutraler Reiz (NS)</span>.`);note('ns');}
        else log(`Glocke allein: ${pct} %. Da ist schon etwas! Aber noch zu wenig – koppelt Glocke und Futter noch öfter.`);}
      else if(st.g===1){st.V*=.62;if(r<.2){st.g=2;mark('g2','g3');$('b4').style.display='';log(`Glocke allein: nur noch ${pct} %. Die Glocke kündigt kein Futter mehr an – die Reaktion ist <span class="op">gelöscht (Extinktion)</span>. Aber ist sie wirklich weg?`);note('loesch');AU.chime();}
        else log(`Glocke allein: ${pct} %. Kein Futter mehr nach dem Ton … Die Reaktion wird schwächer. Weiter so.`);}
      else if(st.g===2){if(st.night){st.g=3;mark('g3');log(`<b>Überraschung: ${pct} %!</b> Nach der Pause ist die gelöschte Reaktion teilweise zurück – <span class="op">Spontanerholung</span>. Gelöscht heißt nicht vergessen.`);note('spont');AU.chime();$('fin').style.display='';btns.slice(0,3).forEach(b=>b.disabled=true);}
        else{st.V*=.8;log(`Glocke allein: ${pct} %. Klicke auf „Eine Nacht vergeht“.`);}}
    }}
  function mark(a,b){$(a).classList.remove('cur');$(a).classList.add('done');if(b)$(b).classList.add('cur');}
  function drawP(){const t=sim.t,a=st.anim;
    vgrad(c,0,0,240,96,['#1d140e','#2a1d14','#3a2819']);R(c,0,96,240,44,'#120d09');
    glow(c,120,10,110,'#ffb860',.18);
    // Tisch
    R(c,30,86,180,6,'#5a3b22');R(c,30,86,180,1,'#7a5434');R(c,40,92,4,4,'#3a2616');R(c,196,92,4,4,'#3a2616');
    // Gestell
    R(c,72,20,3,66,'#4b311c');R(c,150,20,3,66,'#4b311c');R(c,72,20,81,3,'#5d3d23');R(c,95,23,1,22,'#2b1d12');R(c,128,23,1,22,'#2b1d12');
    // Hund groß
    c.save();c.translate(0,0);const sal=a?(a.resp*Math.min(1,Math.max(0,(a.t-.4)*2))):0;
    c.scale(1.5,1.5);dog(c,58,57,t,{salivate:sal,alert:a&&a.kind!=='food'&&a.t<1.5,wag:a&&a.kind!=='bell'&&a.t>.8});c.restore();
    // Glocke
    const sw=a&&a.kind!=='food'?Math.sin(a.t*25)*Math.max(0,1-a.t)*3:0;R(c,34,20,14,2,'#3a2616');line(c,42,22,42+sw,28,'#888');
    ellipseFill(c,42+sw,34,5,5,'#c9a24a');R(c,37+sw,34,11,5,'#c9a24a');R(c,36+sw,38,13,2,'#a8832f');R(c,41+sw,40,2,2,'#6a5020');R(c,39+sw,30,2,4,'#f0d78a');
    if(a&&a.kind!=='food'&&a.t<1.2){c.save();c.globalAlpha=1-a.t/1.2;for(let k=1;k<4;k++){const rr=6+k*5+a.t*12;R(c,42+rr,34,1,1,'#ffe7a0');R(c,42-rr,34,1,1,'#ffe7a0');R(c,42,34-rr*.6,1,1,'#ffe7a0');}c.restore();}
    // Futter
    if(a&&a.kind!=='bell'&&a.t>(a.kind==='pair'?.7:.4)){R(c,50,80,14,5,'#7c7c86');R(c,52,78,10,2,'#9b4a3a');}
    // Röhrchen & Messglas
    line(c,86,60,90,74,'#bcd');line(c,90,74,186,74,'#bcd');line(c,186,74,192,56,'#bcd');
    R(c,188,30,12,56,'#9fb4bf');R(c,189,31,10,54,'#2a3338');const lvl=a?Math.round(sal*44):0;R(c,189,85-lvl,10,lvl,'#cfeaf3');for(let k=0;k<5;k++)R(c,199,40+k*9,2,1,'#dfe');
    // Balken-Historie
    R(c,6,100,228,36,'#0b0807');R(c,6,100,228,1,'#3a2a1a');digits(c,'100',8,101,'#6a5540');
    st.trials.forEach((tr,i)=>{const bh=Math.round(tr.r*28);const col=tr.k==='bell'?'#e2a64b':tr.k==='food'?'#8a8a96':'#5fb4ac';R(c,24+i*11,134-bh,8,bh,col);R(c,24+i*11,134-bh,8,1,tint(col,.4));});
    R(c,22,134,212,1,'#3a2a1a');
    c.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<8;k++)c.fillRect(Math.random()*240,Math.random()*96,1,1);
  }
  simLoop(sim);
}

/* ---- Skinner ---- */
function simSkinner(done){
  openPanel(head('Shaping in der Skinner-Box','Kapitel III · Verhaltensformung')+`<div class="two"><div><canvas class="simc" id="sc" width="300" height="130"></canvas>
   <div class="row"><button class="btn pri" id="rf">🟤 Futterpille geben <span style="opacity:.6">(Leertaste)</span></button></div></div>
   <div><p>Die Ratte kennt den Hebel nicht. Verstärke sie mit einer Futterpille, <b>sobald</b> sie das gewünschte Verhalten zeigt – Schritt für Schritt näher am Ziel.</p>
   <ul class="goals"><li id="s1" class="cur">Stufe 1: Verstärke, wenn die Ratte in der <b>rechten Hälfte</b> ist (rechts der gestrichelten Linie).</li><li id="s2">Stufe 2: Verstärke nur noch <b>direkt am Hebel</b>.</li><li id="s3">Stufe 3: Die Apparatur verstärkt jetzt selbst jeden Hebeldruck. Ziel: <b>8 eigene Hebeldrücke</b>.</li></ul>
   <div class="log" id="log">Beobachte die Ratte. Klicke, wenn sie im markierten Bereich ist.</div><div class="row"><button class="btn pri" id="fin" style="display:none">Weiter ▶</button></div></div></div>`);
  const c=$('sc').getContext('2d');c.imageSmoothingEnabled=false;const log=h=>$('log').innerHTML=h;
  const L=24,Rr=176,FY=104;
  const st={x:.25,tx:.3,f:1,timer:0,b:.08,stage:1,rear:0,eat:0,press:0,cum:[],flash:0,lastRf:0,wrongN:0,pellet:0,lever:0};
  const px=()=>L+st.x*(Rr-L);
  function zone(){return st.stage===1?.5:.82;}
  function reinforce(){if(st.stage>=3){log('Die Apparatur verstärkt jetzt selbst. Beobachte die Kurve rechts: Je steiler, desto häufiger drückt die Ratte.');return;}
    st.pellet=1;AU.plop();
    if(st.x>=zone()){st.b+=.11*(1-st.b);st.flash=.5;st.tx=.93;st.timer=1.2;st.lastRf=sim.t;
      log(`✓ Verstärkt! Die Ratte läuft zum Futternapf – und kommt dabei am Hebel vorbei. Lernstand: ${Math.round(st.b*100)} %`);
      if(st.stage===1&&st.b>=.32){st.stage=2;mk('s1','s2');log('<b>Stufe 2!</b> Die Ratte hält sich öfter rechts auf. Jetzt nur noch verstärken, wenn sie <b>direkt am Hebel</b> ist – die Anforderung wird erhöht.');AU.chime();note('shaping');}
      else if(st.stage===2&&st.b>=.56){st.stage=3;mk('s2','s3');log('<b>Stufe 3!</b> Die Ratte richtet sich am Hebel auf … Ab jetzt liefert die Apparatur bei jedem Druck automatisch Futter.');AU.chime();}}
    else{st.b=Math.max(.04,st.b-.05);st.wrongN++;log(`✗ Falscher Moment: Du hast Verhalten <b>weit weg vom Hebel</b> verstärkt. Die Ratte lernt das Falsche (Skinner nannte so etwas „abergläubisches Verhalten“). Lernstand: ${Math.round(st.b*100)} %`);AU.wrong();}}
  $('rf').onclick=reinforce;const key=e=>{if(e.code==='Space'&&SIM===sim){e.preventDefault();e.stopPropagation();reinforce();}};addEventListener('keydown',key,true);
  $('fin').onclick=()=>{removeEventListener('keydown',key,true);done();};
  function mk(a,b){$(a).classList.remove('cur');$(a).classList.add('done');if(b)$(b).classList.add('cur');}
  const sim={t:0,update(dt){
    st.flash=Math.max(0,st.flash-dt);st.pellet=Math.max(0,st.pellet-dt*.8);st.lever=Math.max(0,st.lever-dt*3);
    if(sim.t-st.lastRf>6&&st.stage<3)st.b=Math.max(.04,st.b-dt*.006);
    if(st.rear>0){st.rear-=dt;return;}
    if(st.eat>0){st.eat-=dt;return;}
    st.timer-=dt;if(st.timer<=0){st.tx=Math.random()<st.b?.86+Math.random()*.1:Math.random()*.95;st.timer=.6+Math.random()*1.1;}
    const d=st.tx-st.x;if(Math.abs(d)>.01){st.f=d>0?1:-1;st.x+=Math.sign(d)*Math.min(Math.abs(d),dt*.42);}
    if(st.x>.86&&Math.random()<dt*(.15+st.b*1.1)){st.rear=.7;st.f=1;st.lever=1;AU.clack();
      if(st.stage>=3){st.press++;st.b+=.04*(1-st.b);st.pellet=1;setTimeout(()=>AU.plop(),250);st.cum.push(sim.t);
        log(`Hebeldruck ${st.press}/8 – die Ratte tut es von selbst, denn es folgt Futter: <span class="op">positive Verstärkung</span>.`);
        if(st.press>=8){mk('s3');log('<b>Geschafft!</b> Aus zufälligem Herumlaufen ist zielgerichtetes Hebeldrücken geworden – allein durch die Konsequenzen. Das ist <span class="op">operante Konditionierung</span>.');note('operant');note('posv');AU.chime();$('fin').style.display='';}}}
  },draw(){const t=sim.t;
    // Box
    vgrad(c,0,0,200,130,['#1b211f','#232c29','#2b3532']);R(c,0,0,200,8,'#121614');R(c,0,FY+2,200,28,'#141816');
    for(let i=0;i<200;i+=6)R(c,i,FY,2,3,'#59615e');R(c,0,FY+2,200,1,'#3a423f');
    glow(c,168,20,60,'#f1ffd0',.18);R(c,164,12,8,4,'#e9f5c8');
    // Zonen
    if(st.stage<3){const zx=Math.round(L+zone()*(Rr-L));for(let y=10;y<FY;y+=4)R(c,zx,y,1,2,'rgba(255,240,180,.35)');c.fillStyle='rgba(255,230,150,.05)';c.fillRect(zx,8,200-zx,FY-8);}
    // Hebel & Napf
    R(c,186,70,14,22,'#3a4442');R(c,180,78+Math.round(st.lever*3),10,3,'#b9c4c0');R(c,188,96,10,6,'#6e7a76');if(st.pellet>0)R(c,191,97,3,2,'#7b4a26');
    c.save();c.translate(Math.round(px()),FY);c.scale(2,2);rat(c,0,0,st.f,{rear:st.rear>0});c.restore();
    if(st.flash>0){c.save();c.globalAlpha=Math.min(1,st.flash*2);R(c,px()-1,FY-26,3,3,'#ffe27a');c.restore();}
    // Lernanzeige
    R(c,6,116,80,5,'#0b0d0c');R(c,6,116,Math.round(80*st.b),5,'#8fd18a');digits(c,st.stage,90,116,'#8fd18a');
    // Kumulativschreiber
    R(c,204,0,96,130,'#e9e2cf');for(let y=6;y<130;y+=8)R(c,204,y,96,1,'#d6cdb4');for(let x=208;x<300;x+=10)R(c,x,0,1,130,'#ddd3ba');
    const span=40,now=t;let n=0,prev=[206,124];
    const pts=st.cum.filter(v=>v>now-span);n=st.cum.length-pts.length;
    for(let k=0;k<=span;k+=.5){const tt=now-span+k;const cnt=st.cum.filter(v=>v<=tt).length;const yy=124-cnt*13;const xx=206+k*2.2;line(c,prev[0],prev[1],xx,yy,'#2a2a6a');prev=[xx,yy];}
    R(c,prev[0]-1,prev[1]-1,3,3,'#a02020');
  }};
  simLoop(sim);
}

/* ---- Bandura Projektor ---- */
function simBandura(done){
  openPanel(head('Drei Filmrollen','Kapitel IV · Bandura 1965')+`<div class="two"><div><canvas class="simc" id="sc" width="220" height="120"></canvas>
   <div class="row"><button class="btn" id="fA">🎞 Film A</button><button class="btn" id="fB">🎞 Film B</button><button class="btn" id="fC">🎞 Film C</button></div></div>
   <div><p>1965 variierte Bandura den Versuch: Drei Gruppen von Kindern sahen denselben Film – nur das <b>Ende</b> war verschieden. Sieh dir alle drei Fassungen an.</p>
   <div class="log" id="log">Wähle eine Filmrolle.</div><div class="row"><button class="btn pri" id="fin" disabled>Vorhersage treffen ▶</button></div></div></div>`);
  const c=$('sc').getContext('2d');c.imageSmoothingEnabled=false;const seen=new Set();let film=null,ft=0;

    if(!film){c.fillStyle='#000';c.fillRect(0,0,220,120);digits(c,'3',104,54,'#ccc');return;}
    const t=ft;const hit=t<3.2?Math.max(0,Math.sin(t*5)):0;
    bobo(c,120,94,hit>.5?.35:Math.sin(t*3)*.08*(t<3.5?1:.3),1);
    human(c,96,94,{top:'#6b5a48',pants:'#3a332c',skin:'#d9b8a0',hair:'#2a221c',hs:'bun',skirt:'#4a3f35',face:1,armUp:hit>.5,hold:(cc,x,y)=>{R(cc,x-1,y-3,4,3,'#8a6a40');R(cc,x,y,2,5,'#6a5030');}},t);
    if(t>3.6){const k=film;const ex=Math.min(1,(t-3.6)/1);const x2=220-ex*60;
      if(k!=='C')human(c,x2,94,{top:k==='A'?'#7a6a50':'#4a4a4a',pants:'#2a2a2a',skin:'#d9b8a0',hair:'#1d1814',hs:'short',face:-1,tie:'#222',armUp:k==='B'&&t>4.8&&Math.sin(t*10)>0},t);
      if(t>4.8){if(k==='A'){R(c,104,62,24,10,'#efe6d0');R(c,108,65,2,2,'#c33');R(c,112,65,2,2,'#3a3');R(c,116,65,2,2,'#33c');R(c,120,64,2,4,'#c80');}
        if(k==='B'){R(c,138,58,26,10,'#efe6d0');R(c,142,61,18,1,'#555');R(c,142,64,12,1,'#555');}}
    }
    // Filmlook
    c.fillStyle=`rgba(255,230,190,${.05*(1-fl)})`;c.fillRect(0,0,220,120);for(let k=0;k<3;k++)if(Math.random()<.3)R(c,Math.random()*220,0,1,120,'rgba(255,255,255,.12)');
    c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,220,4);c.fillRect(0,116,220,4);
   }};
  simLoop(sim);
}

function runWatson(){seq([
  pInfo({title:'Laborprotokoll, Auszug',sub:'Kapitel II · Rekonstruktion',html:`<p><span class="tag">Tag 1</span>Albert, nun etwa 11 Monate alt, sieht die Ratte und greift danach. In dem Moment, in dem er sie berührt, wird hinter seinem Kopf auf die Stahlstange geschlagen. Albert zuckt heftig zusammen.</p>

   <p><span class="tag">Danach</span>Man zeigt Albert die Ratte <b>ohne</b> Knall. Er beginnt sofort zu weinen, dreht sich weg und krabbelt so schnell davon, dass man ihn kaum festhalten kann.</p>
   <p style="opacity:.75">Paraphrasiert nach Watson & Rayner (1920), „Conditioned Emotional Reactions“.</p>`}),
  pAssign({title:'Pawlow im Kinderzimmer',sub:'Kapitel II · Transfer',intro:'Das Prinzip ist dasselbe wie bei Pawlows Hund. Ordne zu.',

   slots:[{id:'1',t:'Die Ratte am Anfang',cap:1},{id:'2',t:'Der laute Knall',cap:1},{id:'3',t:'Das Erschrecken beim Knall',cap:1},{id:'4',t:'Die Ratte nach sieben Kopplungen',cap:1},{id:'5',t:'Die Angst, sobald Albert die Ratte sieht',cap:1}],
   why:'Gelernt wird hier keine Speichelreaktion, sondern ein Gefühl: eine konditionierte emotionale Reaktion.'}),
  pMulti({title:'Wovor fürchtet sich Albert noch?',sub:'Kapitel II · Generalisierung',scene:'Einige Tage später zeigt man Albert verschiedene Dinge – ohne Knall.',q:'Wovor zeigte Albert nun ebenfalls Angst?',
   opts:[{t:'ein weißes Kaninchen',ok:true},{t:'ein Pelzmantel',ok:true},{t:'eine Weihnachtsmann-Maske mit weißem Bart',ok:true},{t:'Holzbauklötze',ok:false}],hint:'Denk daran: Welche Dinge ähneln der Ratte?',
   why:'Reize, die der Ratte ähneln (weiß, pelzig, flauschig), lösen ebenfalls Angst aus: <span class="op">Reizgeneralisierung</span>. Mit den Bauklötzen spielte Albert weiter – er unterschied also: <span class="op">Reizdiskrimination</span>.',notes:['gen','disk']}),
  pMulti({title:'Darf man so forschen?',sub:'Kapitel II · Beurteilung',q:'Was ist aus heutiger Sicht an dem Experiment ethisch problematisch?',
   opts:[{t:'Einem Kleinkind wurde gezielt Angst gemacht.',ok:true},{t:'Die Angst wurde vor Versuchsende nicht wieder abgebaut.',ok:true},{t:'Eine Einwilligung nach heutigen Standards fehlte.',ok:true},{t:'Die Versuche wurden mit einer Kamera gefilmt.',ok:false}],hint:'Frag dich bei jeder Aussage: Schadet das dem Kind?',
   why:'Albert verließ das Krankenhaus, bevor die Angst „wegkonditioniert“ wurde. Heute wären Aufklärung, Einwilligung, Schutz vor Schaden und Nachsorge Pflicht – ein solcher Versuch würde nicht genehmigt.',notes:['ethik']}),
  pInfo({title:'Und wie wird man Angst wieder los?',sub:'Kapitel II · Ausblick',html:`<p>1924 arbeitete <b>Mary Cover Jones</b> mit einem Jungen namens Peter, der große Angst vor Kaninchen hatte. Während Peter etwas Leckeres aß, brachte man das Kaninchen jeden Tag ein Stück näher.</p><p>Die angenehme Situation wurde mit dem Angstreiz gekoppelt – bis Peter das Kaninchen streicheln konnte. Dieses Prinzip heißt <span class="op">Gegenkonditionierung</span>. Es ist bis heute die Grundlage der <b>systematischen Desensibilisierung</b> in der Verhaltenstherapie.</p>`,notes:['gegen']})
 ],()=>finishChapter('watson',[{w:'Watson',t:'Sehen Sie? Kein Instinkt, keine Seele – nur Reize und Reaktionen.'},{t:'Doch die Psychologie fragt bald weiter: Was ist mit Verhalten, das wir selbst zeigen – und was passiert danach?'}]));}

  opts:[{t:'Der Geruch wurde mit Schmerz gekoppelt und ist zum bedingten Reiz geworden.',ok:true},{t:'Der Geruch ist ein unbedingter Reiz, der angeboren Angst auslöst.',f:'Niemand hat von Geburt an Angst vor Desinfektionsmittel. Diese Angst ist gelernt.'},{t:'Du hast beobachtet, wie andere beim Zahnarzt belohnt wurden.',f:'Belohnung würde dich eher entspannen. Denk an Albert: Womit wurde der Reiz gekoppelt?'},{t:'Die Angst ist eine positive Verstärkung dafür, den Termin zu meiden.',f:'Angst ist hier eine Reaktion auf einen Reiz. Frag dich: Wie hat der Geruch diese Wirkung bekommen?'}],
  why:'Wie bei Albert: Ein neutraler Reiz (Geruch) wurde mit einem unbedingten Reiz (Schmerz) gekoppelt. Jetzt löst er allein Angst aus – eine konditionierte emotionale Reaktion.'}
};
SC.now.hot.forEach(h=>h.act=function(){const q=NOWQ[h.q];const st=SC.now.st;
  if(st.solved[h.id])return say([{t:'Das hast du schon durchschaut.'}]);
  pChoice(Object.assign({sub:'Finale · Transfer'},q))(()=>{closePanel();st.solved[h.id]=1;
    if(Object.keys(st.solved).length>=5)setTimeout(epilog,300);});});
function epilog(){
  openPanel(head('Brain-Dump','Finale · Selbstkontrolle')+`<p>Bevor die Reise endet: Schreib aus dem Kopf (ohne Notizbuch!) in zwei, drei Sätzen auf, worin sich <b>klassische</b> und <b>operante Konditionierung</b> unterscheiden. Nenne jeweils ein eigenes Beispiel.</p>
   <textarea id="bd" placeholder="Bei der klassischen Konditionierung … Bei der operanten Konditionierung dagegen …"></textarea>
   <div class="row"><button class="btn" id="ms">Musterlösung zeigen</button></div>
   <div class="mus" id="mu"><b>Musterlösung:</b> Bei der klassischen Konditionierung lernt ein Lebewesen, dass ein Reiz einen anderen <b>ankündigt</b>: Ein neutraler Reiz wird mit einem unbedingten Reiz gekoppelt und löst danach selbst eine (meist unwillkürliche) Reaktion aus – z. B. Angst beim Geruch der Zahnarztpraxis. Bei der operanten Konditionierung lernt es aus den <b>Konsequenzen seines eigenen Verhaltens</b>: Verstärkung macht ein Verhalten häufiger, Bestrafung seltener – z. B. häufiges Handychecken.
   <div class="chk" style="margin-top:.6em"><b>Checkliste – hast du …</b><label><input type="checkbox"> beide Lernformen korrekt benannt?</label><label><input type="checkbox"> bei der klassischen Konditionierung die Kopplung zweier Reize erklärt?</label><label><input type="checkbox"> bei der operanten Konditionierung die Konsequenz des Verhaltens erklärt?</label><label><input type="checkbox"> zu beiden ein passendes Beispiel genannt?</label></div></div>
   <div class="row"><button class="btn pri" id="nx">Reise abschließen ▶</button></div>`);
  $('ms').onclick=()=>$('mu').classList.add('on');
  $('nx').onclick=()=>{closePanel();finishChapter('now',[{t:'Hinter dem Fenster blinkt die Stadt. Irgendwo läutet ein Handy, irgendwo läuft eine Werbung, irgendwo schaut ein Kind einem Vorbild zu.'},{t:'Reiz und Reaktion. Verhalten und Konsequenz. Beobachten und Nachahmen. Du erkennst sie jetzt überall.'}],true);};
}
function finale(){const p=S.score.all?Math.round(S.score.ok/S.score.all*100):0;
  openPanel(head('Reise abgeschlossen','Reiz & Reaktion')+`<p>Du hast vier Experimente miterlebt, die das Verständnis vom Lernen geprägt haben – und sie in deinem Alltag wiedergefunden.</p>
   <p><span class="tag">Erster Versuch</span><b>${S.score.ok} von ${S.score.all}</b> Aufgaben richtig (${p} %). <span class="tag" style="margin-left:.6em">Notizbuch</span><b>${S.notes.length}</b> von ${Object.keys(NOTES).length} Begriffen gesammelt.</p>
   <p style="opacity:.85">${p>=85?'Stark! Du kannst die drei Lerntheorien sicher unterscheiden.':p>=60?'Gute Grundlage. Wiederhole die Kapitel, bei denen du gezögert hast – am besten in ein paar Tagen.':'Lies dein Notizbuch und spiel die Kapitel in ein paar Tagen noch einmal: Wiederholung mit Abstand wirkt am besten.'}</p>
   <p style="font-size:.82em;opacity:.7">Tipp für später: Erkläre einer anderen Person die vier Felder der operanten Konditionierung mit eigenen Beispielen – ohne nachzuschauen.</p>
   <div class="row"><button class="btn pri" id="nx">Zurück ins Archiv</button><button class="btn" id="nb">📖 Notizbuch öffnen</button></div>`);
  $('nx').onclick=()=>{closePanel();go('hub');};$('nb').onclick=()=>{closePanel();openBook();};}

function finishChapter(id,lines,isFinal){S.done[id]=true;AU.chime();say(lines,()=>{if(isFinal)finale();else toast('✓ Kapitel geschafft – der Zeitriss bringt dich zurück ins Archiv.');});}

/* ================= Spieler, Input, Szenenwechsel ================= */
const P={x:240,face:1,walk:0,tx:null,pend:null};
const keys={};
let curHot=null,firstHub=true,going=false;
function setBars(v){S.barsT=v;}
function go(id){if(going)return;going=true;$('fade').style.opacity=1;closePanel();
  setTimeout(()=>{const sc=SC[id];if(!sc.bg)sc.bg=bgCanvas(c=>sc.build(c));S.scene=sc;P.x=sc.start;P.tx=null;P.pend=null;P.face=1;
    if(id!=='hub'&&!sc.hot.find(h=>h.id==='rift'))sc.hot.unshift({id:'rift',x:14,y:182,w:16,label:'Zeitriss · zurück ins Archiv',act(){go('hub');}});
    document.documentElement.style.setProperty('--ac',sc.ac);wrap.style.setProperty('--ac',sc.ac);
    AU.ambient(sc.amb);$('fade').style.opacity=0;going=false;
    if(id==='hub'){P.x=nextDoorX();const f=firstHub;firstHub=false;setBars(0);setTimeout(()=>sc.enter(f),600);}
    else{setBars(1);S.lock=true;caption(sc);setTimeout(()=>{S.lock=false;sc.enter();setBars(0);},3400);}
  },900);}
function nextDoorX(){const nd=nextDoor();const d=DOORS.find(d=>d.sc===nd);return d?d.x:240;}
function caption(sc){$('capk').textContent=sc.chapter;$('capt').textContent=sc.name;$('capp').textContent=sc.place;$('cap').style.opacity=1;setTimeout(()=>$('cap').style.opacity=0,2600);}
function busy(){return D.on||$('panel').classList.contains('on')||$('book').classList.contains('on')||S.lock||going||S.mode!=='play';}
function interact(h){if(!h)return;if(h.id!=='rift')S.seen[S.scene===SC.hub?'hub.'+h.id:sceneId()+'.'+h.id]=true;AU.click();h.act();}
function sceneId(){return Object.keys(SC).find(k=>SC[k]===S.scene);}
addEventListener('keydown',e=>{
  if(S.mode!=='play')return;
  if($('book').classList.contains('on')){if(e.key==='Escape'||e.key==='n'||e.key==='N')closeBook();return;}
  if(D.on&&(e.code==='Space'||e.code==='Enter'||e.key==='e'||e.key==='E')){e.preventDefault();advance();return;}
  if($('panel').classList.contains('on'))return;
  if(e.key==='n'||e.key==='N'){openBook();return;}
  if(e.key==='Escape'&&S.scene!==SC.hub&&!busy()){go('hub');return;}
  keys[e.key.toLowerCase()]=true;
  if((e.code==='Space'||e.key==='e'||e.key==='E'||e.code==='Enter')&&!busy()){e.preventDefault();interact(curHot);}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
cv.addEventListener('click',e=>{if(D.on){advance();return;}if(busy())return;const b=cv.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;
  const hs=S.scene.hot;let best=null;for(const h of hs){if(Math.abs(x-h.x)<h.w/2+4&&y>h.y-14&&y<S.scene.floor+4){if(!best||Math.abs(x-h.x)<Math.abs(x-best.x))best=h;}}
  if(best){P.tx=Math.max(S.scene.minX,Math.min(S.scene.maxX,best.x+(best.x>P.x?-6:6)));P.pend=best;}else{P.tx=Math.max(S.scene.minX,Math.min(S.scene.maxX,x));P.pend=null;}});
$('bBook').onclick=()=>{if(!busy()||D.on)openBook();};
$('bSnd').onclick=()=>{AU.on=!AU.on;$('bSnd').textContent=AU.on?'♪ Ton an':'♪ Ton aus';if(AU.on)AU.ambient(S.scene.amb);else AU.stopAmb();};
$('bHub').onclick=()=>{if(S.scene!==SC.hub&&!busy())go('hub');};
$('bStart').onclick=()=>{AU.init();S.mode='play';$('title').style.opacity=0;setTimeout(()=>$('title').style.display='none',1200);$('hud').style.opacity=1;go('hub');};

/* ================= Hauptschleife ================= */
const vig=bgCanvas(c=>{const g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');c.fillStyle=g;c.fillRect(0,0,W,H);});
SC.hub.bg=bgCanvas(c=>SC.hub.build(c));S.scene=SC.hub;
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;const t=S.t;const sc=S.scene;
  // Bewegung
  if(!busy()){let dir=0;if(keys['arrowleft']||keys['a'])dir=-1;if(keys['arrowright']||keys['d'])dir=1;
    if(dir){P.tx=null;P.pend=null;}
    else if(P.tx!=null){const d=P.tx-P.x;if(Math.abs(d)<1.5){P.tx=null;if(P.pend){const h=P.pend;P.pend=null;interact(h);}}else dir=Math.sign(d);}
    if(dir){P.x=Math.max(sc.minX,Math.min(sc.maxX,P.x+dir*dt*62));P.face=dir;P.walk+=dt*11;}else P.walk=0;
  }else P.walk=0;
  // Rendern
  ctx.drawImage(sc.bg,0,0);
  if(sc!==SC.hub)rift(ctx,14,sc.floor,t);
  sc.draw(ctx,t,dt);
  // Hotspot-Marker
  curHot=null;let bd=99;
  for(const h of sc.hot){const d=Math.abs(P.x-h.x);if(d<h.w/2+12&&d<bd){bd=d;curHot=h;}
    const key=(sc===SC.hub?'hub.':sceneId()+'.')+h.id;if(!S.seen[key]&&h.id!=='rift'&&sc!==SC.hub&&!(sc===SC.now&&sc.st.solved[h.id]))hotMark(ctx,h.x,h.y-6,t,sc.ac);}
  if(S.mode==='play')human(ctx,P.x,sc.floor,Object.assign({face:P.face,walk:P.walk},PLAYER),t);
  // Kino-Look
  ctx.drawImage(vig,0,0);
  for(let i=0;i<160;i++){ctx.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';ctx.fillRect(Math.random()*W|0,Math.random()*H|0,1,1);}
  S.bars+=(S.barsT-S.bars)*Math.min(1,dt*3);const bh=Math.round(S.bars*26);if(bh>0){R(ctx,0,0,W,bh,'#000');R(ctx,0,H-bh,W,bh,'#000');}
  // UI
  const pr=$('prompt');
  if(curHot&&!busy()){const lb=typeof curHot.label==='function'?curHot.label():curHot.label;pr.innerHTML=`<kbd>E</kbd>${lb}`;pr.style.left=(curHot.x/W*100)+'%';pr.style.top=((curHot.y-10)/H*100)+'%';pr.style.opacity=1;}else pr.style.opacity=0;
  if(S.mode==='play'&&sc.obj)$('objt').textContent=sc.obj();
  if(D.on&&D.shown<D.cur.t.length){D.shown=Math.min(D.cur.t.length,D.shown+dt*55);$('dtxt').textContent=D.cur.t.slice(0,Math.floor(D.shown));}
  else if(D.on)$('dtxt').textContent=D.cur.t;
  requestAnimationFrame(frame);}
$('fade').style.opacity=0;
requestAnimationFrame(frame);
</script>
