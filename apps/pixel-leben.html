<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel-Leben – Ein Spiel über Bindung, Identität und Selbstwirksamkeit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#ece4d3;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;overflow:hidden;background:#000;cursor:pointer;user-select:none}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%);z-index:2}
#grain{z-index:3;opacity:.09;mix-blend-mode:overlay;background-size:220px 220px;animation:grain .6s steps(5) infinite}
@keyframes grain{0%{background-position:0 0}20%{background-position:-50px 30px}40%{background-position:40px -60px}60%{background-position:-25px 70px}80%{background-position:65px 10px}}
.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.4s cubic-bezier(.6,0,.2,1);z-index:6}
.bar.top{top:0}.bar.bot{bottom:0}
body.cine .bar{height:9cqh}
#fade{background:#000;opacity:1;z-index:30;transition:opacity .9s ease}
/* Dialog */
#say{position:absolute;left:7cqw;right:7cqw;bottom:2.2cqh;z-index:12;display:none}
#say .box{position:relative;background:rgba(7,8,14,.84);border:1px solid rgba(255,236,200,.16);box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.55);padding:1.8cqh 2.2cqw 2.2cqh;font-size:max(13px,2.15cqw);line-height:1.5;min-height:9cqh}
#say.narr .box{background:transparent;border:none;box-shadow:none;text-align:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:max(14px,2.4cqw);text-shadow:0 2px 6px #000,0 0 2px #000;color:#f3ead8;padding-bottom:1.2cqh}
#who{font-size:.72em;letter-spacing:.22em;text-transform:uppercase;color:#f0c27b;margin-bottom:.35em}
#hint{position:absolute;right:1.4cqw;bottom:.7cqh;font-size:.55em;opacity:.55;animation:blink 1.1s infinite;font-style:normal}
@keyframes blink{50%{opacity:.1}}
#choices{position:absolute;left:9cqw;right:9cqw;bottom:2.2cqh;z-index:13;display:none;flex-direction:column;gap:.9cqh}
.cq{font-size:max(11px,1.6cqw);letter-spacing:.2em;text-transform:uppercase;color:#f0c27b;text-shadow:0 2px 4px #000;margin-bottom:.3cqh}
.ch{background:rgba(7,8,14,.88);border:1px solid rgba(240,194,123,.3);color:#efe6d4;font:inherit;font-size:max(12px,1.85cqw);line-height:1.4;text-align:left;padding:1.1cqh 1.7cqw;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.ch:hover,.ch:focus-visible{background:rgba(240,194,123,.16);border-color:#f0c27b;outline:none;transform:translateX(5px)}
.ch .k{color:#f0c27b;margin-right:.7em}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:9cqh;z-index:14;display:flex;align-items:center;justify-content:space-between;padding:0 2cqw;pointer-events:none;opacity:0;transition:opacity .8s}
body.cine #hud{opacity:1}
#chap{font-size:max(10px,1.45cqw);letter-spacing:.3em;text-transform:uppercase;color:#a9a191}
#hud .hb{pointer-events:auto;background:none;border:1px solid rgba(255,255,255,.18);color:#cfc6b4;font:inherit;font-size:max(10px,1.3cqw);letter-spacing:.12em;padding:.6cqh 1.1cqw;margin-left:.8cqw;cursor:pointer}
#hud .hb:hover{border-color:#f0c27b;color:#f0c27b}
#epi{position:absolute;top:10.5cqh;left:50%;transform:translateX(-50%);z-index:12;font-size:max(10px,1.35cqw);letter-spacing:.22em;text-transform:uppercase;color:#f3ead8;background:rgba(0,0,0,.45);padding:.6cqh 1.4cqw;opacity:0;transition:opacity .6s;white-space:nowrap}
#epi.show{opacity:1}
#meter{position:absolute;top:10.5cqh;left:2cqw;z-index:12;display:none;font-size:max(10px,1.3cqw);letter-spacing:.15em;text-transform:uppercase;color:#cfe7ff;text-shadow:0 1px 3px #000}
#meter .track{margin-top:.6cqh;width:22cqw;height:1.6cqh;min-height:8px;background:rgba(0,0,0,.55);border:1px solid rgba(180,220,255,.35);padding:2px}
#meter .fill{height:100%;width:0;background:linear-gradient(90deg,#3f7fd1,#7fd3ff);box-shadow:0 0 8px #7fd3ff;transition:width 1.2s cubic-bezier(.3,1.4,.5,1)}
#toast{position:absolute;right:2cqw;top:10.5cqh;z-index:15;background:rgba(10,12,20,.9);border:1px solid #f0c27b;color:#f3d9a8;font-size:max(11px,1.4cqw);padding:.8cqh 1.4cqw;opacity:0;transform:translateY(-8px);transition:.5s;pointer-events:none}
#toast.show{opacity:1;transform:none}
/* Title card */
#tcard{position:absolute;inset:0;z-index:31;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity 1.1s;pointer-events:none}
#tcard.show{opacity:1}
#tcard .k{font-size:max(11px,1.6cqw);letter-spacing:.6em;text-transform:uppercase;color:#9b927f;margin-bottom:2cqh}
#tcard .t{font-family:Georgia,"Times New Roman",serif;font-size:max(28px,6.4cqw);color:#f4e7cc;letter-spacing:.04em;text-shadow:0 0 30px rgba(240,194,123,.35)}
#tcard .s{font-family:Georgia,serif;font-style:italic;font-size:max(14px,2.2cqw);color:#b8ae9a;margin-top:2cqh}
#tcard .line{width:0;height:1px;background:linear-gradient(90deg,transparent,#f0c27b,transparent);margin:2.5cqh auto 0;transition:width 2s ease .3s}
#tcard.show .line{width:30cqw}
/* Menu */
#menu{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#menu .t{font-family:Georgia,serif;font-size:max(34px,8cqw);color:#f6ead0;letter-spacing:.06em;text-shadow:0 0 40px rgba(150,170,255,.45),0 4px 12px #000}
#menu .s{font-family:Georgia,serif;font-style:italic;font-size:max(14px,2.2cqw);color:#cfc4ae;margin:1.2cqh 0 4cqh;text-shadow:0 2px 6px #000}
#menu .m{display:flex;flex-direction:column;gap:1.1cqh;pointer-events:auto;min-width:34cqw}
#menu button{background:rgba(6,7,16,.62);border:1px solid rgba(240,220,180,.25);color:#efe6d4;font:inherit;font-size:max(12px,1.75cqw);letter-spacing:.12em;padding:1.2cqh 2cqw;cursor:pointer;transition:.2s}
#menu button:hover,#menu button:focus-visible{border-color:#f0c27b;color:#f0c27b;background:rgba(20,18,30,.85);outline:none;letter-spacing:.18em}
#menu button.pri{border-color:#f0c27b;color:#f6d79f}
#menu .foot{margin-top:4cqh;font-size:max(10px,1.2cqw);letter-spacing:.25em;color:#8d8676;text-transform:uppercase}
#splash{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
#splash .t{font-family:Georgia,serif;font-size:max(30px,6cqw);color:#f2e6cc;letter-spacing:.08em}
#splash .s{margin-top:3cqh;font-size:max(11px,1.5cqw);letter-spacing:.35em;text-transform:uppercase;color:#8f8878;animation:blink 1.6s infinite}
#splash .h{margin-top:1.4cqh;font-size:max(10px,1.2cqw);color:#6c6658;letter-spacing:.15em}
/* Panels */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px}
.card{max-width:780px;width:100%;max-height:94vh;overflow:auto;background:linear-gradient(180deg,#15161f,#0c0d13);border:1px solid rgba(240,194,123,.28);padding:26px 30px 24px;box-shadow:0 24px 70px #000;font-size:16px;line-height:1.55;color:#e6ddcb;animation:pop .4s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.card h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:25px;color:#f3d9a8;margin-bottom:12px;line-height:1.25}
.card h3{font-family:Georgia,serif;font-weight:normal;font-size:18px;color:#f3d9a8;margin:16px 0 6px}
.kick{letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#8f97ab;margin-bottom:6px}
.card p{margin:0 0 10px}
.card ul{margin:4px 0 12px 20px}.card li{margin:3px 0}
.card b{color:#f6e2bb}
.dim{color:#9a927f;font-size:14px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.btn{background:rgba(255,255,255,.03);border:1px solid rgba(240,194,123,.3);color:#efe6d4;font:inherit;font-size:15px;text-align:left;padding:11px 15px;cursor:pointer;transition:.15s;line-height:1.4}
.btn:hover,.btn:focus-visible{background:rgba(240,194,123,.14);border-color:#f0c27b;outline:none}
.btn.pri{border-color:#f0c27b;color:#f6d79f;text-align:center}
.btn .k{color:#f0c27b;margin-right:.6em}
.verdict{font-family:Georgia,serif;font-size:20px;margin-bottom:8px}
.good{color:#9be3a1}.bad{color:#ff9f8c}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl td,.tbl th{border-top:1px solid rgba(255,255,255,.08);padding:7px 8px;vertical-align:top;text-align:left}
.tbl th{color:#f0c27b;font-weight:normal;letter-spacing:.06em;width:28%}
.note{border-left:2px solid #f0c27b;background:rgba(240,194,123,.06);padding:9px 13px;margin:12px 0;font-size:15px}
.warn{border-left-color:#ff9f8c;background:rgba(255,159,140,.07)}
details{border:1px solid rgba(255,255,255,.12);padding:9px 13px;margin:10px 0;background:rgba(255,255,255,.02)}
summary{cursor:pointer;color:#f0c27b}
details[open] summary{margin-bottom:6px}
.quad{position:relative;width:100%;max-width:420px;aspect-ratio:1.35;margin:10px auto 6px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border-left:2px solid #8f97ab;border-bottom:2px solid #8f97ab}
.quad div.q{display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:#a9a18f;border:1px dashed rgba(255,255,255,.08);padding:4px}
.quad div.q.on{background:rgba(240,194,123,.13);color:#f6d79f}
.quad .dot{position:absolute;width:14px;height:14px;background:#7fd3ff;box-shadow:0 0 12px #7fd3ff;transform:translate(-50%,50%);image-rendering:pixelated}
.ax{font-size:12px;color:#8f97ab;text-align:center;letter-spacing:.1em}
.axy{position:absolute;left:-26px;top:50%;transform:rotate(-90deg) translateX(50%);transform-origin:left top;font-size:12px;color:#8f97ab;letter-spacing:.1em;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 7px;margin:2px 4px 2px 0;border:1px solid rgba(255,255,255,.2);color:#cfc6b4}
.tag.e{border-color:#7fd3ff;color:#9fdcff}.tag.c{border-color:#f0c27b;color:#f6d79f}.tag.n{opacity:.6}
.log{font-size:14.5px}.log div{padding:7px 0;border-top:1px solid rgba(255,255,255,.07)}
.nbitem{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}
.nbitem h3{margin-top:0}
#rot{position:fixed;inset:0;z-index:80;background:#05060c;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.6;color:#d8cfbd}
#rot button{margin-top:18px;background:none;border:1px solid #f0c27b;color:#f0c27b;font:inherit;padding:10px 18px}
@media (orientation:portrait) and (max-width:760px){#rot{display:flex}}
#rot.dismissed{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="vig" class="ov"></div>
    <div id="grain" class="ov"></div>
    <div class="bar top"></div><div class="bar bot"></div>
    <div id="hud"><div id="chap"></div><div><button class="hb" id="bNb">Notizbuch</button><button class="hb" id="bSnd">Ton: an</button><button class="hb" id="bMenu">Menü</button></div></div>
    <div id="epi"></div>
    <div id="meter"><div>Selbstwirksamkeit</div><div class="track"><div class="fill"></div></div></div>
    <div id="toast"></div>
    <div id="say"><div class="box"><div id="who"></div><div id="txt"></div><div id="hint">▼</div></div></div>
    <div id="choices"></div>
    <div id="menu">
      <div class="t">Pixel-Leben</div>
      <div class="s">Ein Spiel über Bindung, Identität und Selbstwirksamkeit</div>
      <div class="m">
        <button class="pri" data-run="all">▶ Neues Spiel</button>
        <button data-run="1">Kapitel I · Die Fremde Situation</button>
        <button data-run="2">Kapitel II · Wer bin ich?</button>
        <button data-run="3">Kapitel III · Ich schaffe das</button>
        <button data-run="4">Epilog · Ein ganzes Leben</button>
      </div>
      <div class="foot">Pädagogik / Psychologie · Prototyp</div>
    </div>
    <div id="fade" class="ov"></div>
    <div id="tcard"></div>
    <div id="splash"><div class="t">Pixel-Leben</div><div class="s">Klicken, um zu beginnen</div><div class="h">Mit Ton · Kopfhörer empfohlen</div></div>
  </div>
</div>
<div id="panel" class="modal"><div class="card" id="pcard"></div></div>
<div id="nb" class="modal"><div class="card" id="nbcard"></div></div>
<div id="rot"><div><b>Tipp:</b> Dreh dein Gerät ins Querformat –<br>das Spiel ist für Breitbild gemacht.</div><button onclick="document.getElementById('rot').classList.add('dismissed')">Trotzdem spielen</button></div>

<script>
"use strict";
/* =========================================================
   GRUNDLAGEN
   ========================================================= */
const W=320,H=180;
const $=s=>document.querySelector(s);
const cv=$('#c');cv.width=960;cv.height=540;
const dctx=cv.getContext('2d');dctx.imageSmoothingEnabled=false;
const off=document.createElement('canvas');off.width=W;off.height=H;
const ctx=off.getContext('2d');ctx.imageSmoothingEnabled=false;
/* Kamera: zoomt in die 320x180-Welt hinein */
const cam={x:W/2,y:H/2,z:1,follow:null,fy:-10,gen:0};
let T=0;
const ABORT={abort:true};
let runId=0;const aborters=new Set();
function cancellable(fn){const id=runId;return new Promise((res,rej)=>{const off=()=>rej(ABORT);aborters.add(off);fn(v=>{aborters.delete(off);if(id!==runId)rej(ABORT);else res(v);});});}
function abortAll(){runId++;const a=[...aborters];aborters.clear();a.forEach(f=>f());}
const wait=ms=>cancellable(r=>setTimeout(r,ms));
const bg=p=>{p.catch(()=>{});return p;};
const par=(...ps)=>Promise.all(ps);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}

/* Filmkorn */
(function(){const g=document.createElement('canvas');g.width=g.height=128;const gx=g.getContext('2d');const d=gx.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}gx.putImageData(d,0,0);$('#grain').style.backgroundImage=`url(${g.toDataURL()})`;})();

/* Farben & Zeichnen */
const HXC={};
function hx(c){if(HXC[c])return HXC[c];const s=c.replace('#','');return HXC[c]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('');}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function bands(y0,y1,stops,step=2){const n=stops.length-1;for(let y=y0;y<y1;y+=step){const t=(y-y0)/(y1-y0);const i=Math.min(n-1,Math.floor(t*n));const lt=Math.round((t*n-i)*5)/5;R(0,y,W,step,mix(stops[i],stops[i+1],lt));}}
function glow(x,y,r,col,a){if(r<=0||a<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);const c=hx(col);g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function beam(pts,col){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fill();ctx.restore();}
function hillY(base,f,amp,ph,x){return Math.round(base+Math.sin(x*f+ph)*amp+Math.sin(x*f*2.7+ph*3)*amp*.35);}
function hill(base,col,f,amp,ph){ctx.fillStyle=col;for(let x=0;x<W;x++){const y=hillY(base,f,amp,ph,x);ctx.fillRect(x,y,1,H-y);}}
function disc(cx,cy,r,col){ctx.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.round(Math.sqrt(r*r-y*y));ctx.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1);}}

/* =========================================================
   FIGUREN
   ========================================================= */
const KIND={adult:{bw:8,bh:10,hw:6,hh:6,lh:8,lw:3,aw:2},teen:{bw:7,bh:9,hw:6,hh:6,lh:8,lw:3,aw:2},tod:{bw:6,bh:5,hw:6,hh:5,lh:3,lw:2,aw:1},elder:{bw:8,bh:10,hw:6,hh:6,lh:7,lw:3,aw:2}};
function mk(o){return Object.assign({x:0,y:150,kind:'adult',facing:1,state:'idle',visible:true,skin:'#e0b48c',hair:'#3b2416',top:'#7a4b8c',pants:'#2e3550',shoe:'#17161c',long:false,emote:null,tw:null,jit:0,cry:false,chair:false,attach:null,phone:false,cane:false},o);}
const GLY={'!':['1','1','1','0','1'],'?':['111','001','010','000','010'],'…':['10101'],'♥':['01010','11111','11111','01110','00100'],'#':['101','010','101'],'~':['0110','1001','0000','0110','1001'],'♪':['0011','0101','0100','1100','1100']};
const GLC={'!':'#ffd166','?':'#bde0fe','…':'#f3ead8','♥':'#ff6b8b','#':'#ff5d5d','~':'#a8e6cf','♪':'#ffe9a8'};
function drawEmote(e,x,y){const g=GLY[e];if(!g)return;const w=g[0].length,h=g.length,bob=Math.round(Math.sin(T/260));const ox=x-Math.floor(w/2),oy=y-h+bob;for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(g[r][c]==='1')R(ox+c+1,oy+r+1,1,1,'rgba(0,0,0,.7)');for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(g[r][c]==='1')R(ox+c,oy+r,1,1,GLC[e]);}
function drawPerson(a){
  const k=KIND[a.kind];const f=a.facing;
  const jx=a.jit?Math.round(Math.sin(T/45)*a.jit):0;
  const x=Math.round(a.x)+jx,y=Math.round(a.y);
  const walking=!!(a.tw&&a.tw.walk);const ph=walking?(Math.floor(T/150)%2):0;
  const sit=a.state==='sit'||a.state==='slump';
  const bl=x-Math.floor(k.bw/2);
  let bodyTop;
  if(!a.attach){ctx.fillStyle='rgba(0,0,0,.33)';ctx.fillRect(bl-1,y,k.bw+2,1);ctx.fillRect(bl,y+1,k.bw,1);}
  if(sit&&a.chair){
    const hip=y-7;bodyTop=hip-k.bh;
    if(f>=0){R(bl+2,hip-2,k.bw+1,2,a.pants);R(bl+k.bw+1,hip-2,2,8,a.pants);R(bl+k.bw+1,y-1,3,1,a.shoe);}
    else{R(bl-3,hip-2,k.bw+1,2,a.pants);R(bl-3,hip-2,2,8,a.pants);R(bl-4,y-1,3,1,a.shoe);}
  }else if(sit){
    bodyTop=y-k.bh-(a.kind==='tod'?1:2);const len=a.kind==='tod'?4:6;const sx=f>=0?bl+2:bl+k.bw-2-len;
    R(sx,y-2,len,2,a.pants);R(f>=0?sx+len-1:sx,y-2,1,2,a.shoe);
  }else{

   UI-HELFER
   ========================================================= */
const fadeEl=$('#fade'),sayEl=$('#say'),whoEl=$('#who'),txtEl=$('#txt'),hintEl=$('#hint');
let advance=null,keyChoice=null;
function cine(on){document.body.classList.toggle('cine',on);}
function setHud(t){$('#chap').textContent=t;}
function fadeOut(ms=900){fadeEl.style.transitionDuration=ms+'ms';fadeEl.style.opacity=1;return wait(ms);}
function fadeIn(ms=1100){fadeEl.style.transitionDuration=ms+'ms';fadeEl.style.opacity=0;return wait(ms);}
async function cut(s,acts=[],o={}){await fadeOut(o.out||800);setScene(s);actors=acts;await wait(160);await fadeIn(o.in||1100);}
function epi(t){const e=$('#epi');if(!t){e.classList.remove('show');return;}e.textContent=t;e.classList.add('show');}
function showMeter(on){$('#meter').style.display=on?'block':'none';}
function setMeter(v){$('#meter .fill').style.width=Math.max(0,Math.min(10,v))*10+'%';}
let toastT=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3200);}
function say(who,text,o={}){
  return cancellable(res=>{
    $('#choices').style.display='none';
    sayEl.style.display='block';sayEl.className=who?'':'narr';whoEl.textContent=who||'';whoEl.style.display=who?'block':'none';
    txtEl.textContent='';hintEl.style.visibility='hidden';
    let i=0,done=false;
    const typer=setInterval(()=>{if(i<text.length){i++;txtEl.textContent=text.slice(0,i);if(i%3===0&&who)blip();}else{clearInterval(typer);fin();}},who?24:30);
    function fin(){if(done)return;done=true;clearInterval(typer);txtEl.textContent=text;hintEl.style.visibility='visible';if(o.auto)setTimeout(finish,o.auto);}
    function finish(){if(advance===h)advance=null;sayEl.style.display='none';res();}
    const h=()=>{if(!done)fin();else finish();};
    advance=h;
  });
}
function choose(prompt,opts){
  return cancellable(res=>{
    sayEl.style.display='none';
    const box=$('#choices');box.innerHTML='';
    if(prompt){const p=document.createElement('div');p.className='cq';p.textContent=prompt;box.appendChild(p);}
    opts.forEach((o,i)=>{const b=document.createElement('button');b.className='ch';b.innerHTML=`<span class="k">${i+1}</span>${o}`;b.onclick=e=>{e.stopPropagation();done(i);};box.appendChild(b);});
    box.style.display='flex';
    keyChoice=n=>{if(n<opts.length)done(n);};
    function done(i){keyChoice=null;box.style.display='none';clickS();res(i);}
  });
}
function panel(html,buttons){
  return cancellable(res=>{
    const P=$('#panel'),C=$('#pcard');
    C.innerHTML=html+'<div class="btns"></div>';
    const bx=C.querySelector('.btns');
    buttons.forEach((b,i)=>{if(typeof b==='string')b={label:b};const el=document.createElement('button');el.className='btn'+(b.primary?' pri':'');el.innerHTML=(buttons.length>1&&!b.primary?`<span class="k">${i+1}</span>`:'')+b.label;el.onclick=()=>{P.style.display='none';clickS();res(b.value!==undefined?b.value:i);};bx.appendChild(el);});
    P.style.display='flex';C.scrollTop=0;
  });
}
async function titleCard(k,t,s){
  const c=$('#tcard');c.innerHTML=`<div class="k">${k}</div><div class="t">${t}</div><div class="s">${s}</div><div class="line"></div>`;
  await fadeOut(800);c.classList.add('show');tone(130.8,3,'sine',.07,true);
  await cancellable(res=>{const h=()=>{if(advance===h)advance=null;res();};advance=h;setTimeout(()=>{if(advance===h){advance=null;res();}},4300);});
  c.classList.remove('show');await wait(900);
}
function resetUI(){sayEl.style.display='none';$('#choices').style.display='none';$('#panel').style.display='none';$('#tcard').classList.remove('show');epi(null);advance=null;keyChoice=null;}

const NB={
 bindung:{t:'Bindungstypen nach Ainsworth',h:`<p>In der <b>Fremden Situation</b> (Ainsworth) wird das Verhalten von Kleinkindern (ca. 12–18 Monate) bei Trennung und Wiedervereinigung mit der Bezugsperson beobachtet.</p><ul><li><b>Sicher (B):</b> Nutzt die Bezugsperson als sichere Basis; Kummer bei Trennung; sucht bei Rückkehr Nähe und lässt sich schnell trösten.</li><li><b>Unsicher-vermeidend (A):</b> Kaum sichtbare Reaktion; meidet die Bezugsperson bei Rückkehr – körperlich trotzdem gestresst.</li><li><b>Unsicher-ambivalent (C):</b> Wenig Exploration, starke Belastung; sucht Nähe und wehrt sie zugleich ab.</li><li><b>Desorganisiert (D):</b> Widersprüchliches Verhalten, Erstarren (ergänzt von Main & Solomon).</li></ul><p>Entscheidend für die Entwicklung sicherer Bindung ist die <b>Feinfühligkeit</b> der Bezugsperson.</p>`},
 ahnert:{t:'Primäre und sekundäre Bindung (Ahnert)',h:`<p>Kinder bauen neben <b>primären Bindungen</b> (meist zu den Eltern) auch <b>sekundäre Bindungen</b> auf – etwa zu Erzieherinnen und Erziehern in der Kita.</p><p>Diese entstehen vor allem durch verlässliche Zuwendung, Sicherheit, Stressreduktion und Unterstützung beim Erkunden. Frühpädagogische Fachkräfte können gelungene Bindung also aktiv fördern.</p>`},
 marcia:{t:'Identitätsstatus nach Marcia',h:`<p>Zwei Dimensionen: <b>Exploration</b> (aktive Auseinandersetzung mit Möglichkeiten) und <b>Verpflichtung</b> (Festlegung auf Ziele und Werte).</p><ul><li><b>Diffus:</b> keine Exploration, keine Verpflichtung</li><li><b>Übernommen:</b> Verpflichtung ohne eigene Exploration</li><li><b>Moratorium:</b> aktive Exploration, noch keine Verpflichtung</li><li><b>Erarbeitet:</b> Verpflichtung nach eigener Exploration</li></ul><p>Der Status kann sich je nach Lebensbereich unterscheiden und im Lauf des Lebens wechseln.</p>`},
 swe:{t:'Selbstwirksamkeits- und Ergebniserwartung (Bandura)',h:`<p><b>Selbstwirksamkeitserwartung</b> (auch Kompetenzerwartung): die Überzeugung, eine Handlung aus eigener Kraft erfolgreich ausführen zu können. <i>„Ich kann das.“</i></p><p><b>Ergebniserwartung</b>: die Erwartung, dass eine Handlung zu einem bestimmten Ergebnis führt. <i>„Wenn ich das tue, passiert das.“</i></p><p>Wer zwar das Ergebnis für erreichbar hält, sich die Handlung aber nicht zutraut, wird sie oft vermeiden.</p>`},
 quellen:{t:'Vier Quellen der Selbstwirksamkeit',h:`<ol style="margin-left:20px"><li><b>Eigene Erfolgserlebnisse</b> (Meisterungserfahrungen) – die stärkste Quelle</li><li><b>Stellvertretende Erfahrungen</b> – ein Modell, das einem ähnlich ist, schafft es</li><li><b>Verbale Ermutigung</b> – glaubwürdige, konkrete Überzeugung durch andere</li><li><b>Körperliche und emotionale Zustände</b> – und wie man sie deutet</li></ol><p><b>Selbstregulation</b> nach Bandura: Selbstbeobachtung → Selbstbewertung (Vergleich mit eigenen Standards) → Selbstreaktion (z. B. Selbstbelohnung).</p>`},
 baltes:{t:'Lebensspannenpsychologie (Baltes)',h:`<ul><li>Entwicklung ist ein <b>lebenslanger</b> Prozess.</li><li>Sie ist <b>multidirektional</b>: In jedem Alter gibt es Gewinne und Verluste.</li><li>Menschen bleiben <b>plastisch</b>, also veränderbar – in Grenzen.</li><li>Entwicklung ist <b>eingebettet</b>: altersbezogene, geschichtliche und nicht-normative (unvorhersehbare) Einflüsse wirken zusammen.</li></ul><p>Jede Lebensphase stellt typische <b>Entwicklungsaufgaben</b> – etwa im Jugendalter Identität und Berufswahl, im frühen Erwachsenenalter das Bewähren im Beruf.</p>`}
};
const unlocked=new Set();

/* =========================================================

   ========================================================= */
const TYPES={
 B:{name:'Sicher gebunden (Typ B)',exp:'Erkundet aktiv und nutzt die Mutter als „sichere Basis“ – schaut immer wieder zu ihr.',tr:'Zeigt Kummer, protestiert, sucht die Mutter.',wv:'Sucht Nähe, lässt sich schnell trösten und spielt dann weiter.',hg:'Die Bezugsperson verhält sich <b>feinfühlig</b>: Sie nimmt die Signale des Kindes wahr, deutet sie richtig und reagiert prompt und angemessen.'},
 A:{name:'Unsicher-vermeidend (Typ A)',exp:'Spielt viel, beachtet die Mutter kaum.',tr:'Kaum sichtbare Reaktion – körperlich aber deutlich gestresst (Studien zeigen z. B. erhöhten Puls und Cortisolwerte).',wv:'Ignoriert die Mutter oder wendet sich ab; will schnell wieder vom Arm.',hg:'Die Bezugsperson weist Bindungswünsche häufig zurück. Das Kind lernt, sein Bindungsverhalten zu unterdrücken.'},
 C:{name:'Unsicher-ambivalent (Typ C)',exp:'Erkundet kaum, bleibt dicht bei der Mutter.',tr:'Extrem belastet, untröstlich.',wv:'Sucht Nähe und wehrt sie gleichzeitig ärgerlich ab; lässt sich kaum beruhigen.',hg:'Die Bezugsperson reagiert <b>unvorhersehbar</b> – mal zugewandt, mal abweisend. Das Kind kann sich nicht auf sie verlassen.'},
 D:{name:'Desorganisiert (Typ D)',exp:'Unterbrochene, unvollständige Bewegungen; plötzliches Erstarren.',tr:'Kein klares Muster, z. B. Erstarren oder zielloses Umherlaufen.',wv:'Nähert sich mit abgewandtem Blick, erstarrt, sinkt in sich zusammen.',hg:'Von Main & Solomon ergänzt. Häufig bei Bezugspersonen, die auf das Kind ängstigend wirken oder selbst verängstigt sind, etwa durch unverarbeitete Traumata.'}
};
const KIDS=[{n:'Mia',top:'#e07a5f',hair:'#7a4a28'},{n:'Emil',top:'#6aa36f',hair:'#d9a441'},{n:'Lina',top:'#e9c46a',hair:'#3b2416'},{n:'Noah',top:'#5e8ad6',hair:'#5a3320'}];
const C1={done:0,correct:0,bag:[],kidBag:[],card:false};

async function chapter1(){
  setHud('Kapitel I · Bindung');mood('warm');showMeter(false);
  await titleCard('Kapitel I','Die Fremde Situation','Ein Kind. Ein Raum. Ein Abschied.');
  setScene(SC.play);actors=[];cine(true);await fadeIn(1400);
  await say(null,'Ein Beobachtungsraum. Ende der 1960er-Jahre entwickelte die Psychologin Mary Ainsworth hier ein Verfahren, das etwas Unsichtbares sichtbar machen sollte: Bindung.');
  await say(null,'Du sitzt hinter einer Einwegscheibe. Gleich kommt ein etwa einjähriges Kind mit seiner Mutter herein.');
  let help=await panel(`<div class="kick">Beobachtungsauftrag</div><h2>Worauf du achten sollst</h2><ul><li><b>Exploration:</b> Wie frei spielt und erkundet das Kind, solange die Mutter da ist?</li><li><b>Trennung:</b> Wie reagiert es, wenn die Mutter den Raum verlässt?</li><li><b>Wiedervereinigung:</b> Was passiert, wenn sie zurückkommt?</li></ul><p class="dim">Verkürzte Fassung: Im Original besteht die Fremde Situation aus acht Episoden von je etwa drei Minuten.</p><p>Mit Beobachtungshilfe beschreiben Untertitel, was zu sehen ist. Ohne Hilfe musst du selbst genau hinschauen.</p>`,[{label:'▶ Mit Beobachtungshilfe beginnen',value:true,primary:true},{label:'Ohne Hilfe beobachten – nur Bilder',value:false}]);
  for(;;){
    if(!C1.bag.length)C1.bag=shuffle(['B','A','C','D']);
    if(!C1.kidBag.length)C1.kidBag=shuffle(KIDS);
    const type=C1.bag.pop(),kid=C1.kidBag.pop();
    await observe(type,kid,help);
    await classify(type,kid);
    if(!C1.card){C1.card=true;await wissenBindung();}
    const nx=await panel(`<div class="kick">Zwischenstand</div><h2>Wie geht es weiter?</h2><p>Du hast <b>${C1.done}</b> ${C1.done===1?'Kind':'Kinder'} beobachtet und <b>${C1.correct}</b> davon richtig zugeordnet.</p><p class="dim">Jedes Kind zeigt zufällig einen der vier Bindungstypen. Tipp: Probier es als Nächstes ohne Untertitel.</p>`,[{label:'Nächstes Kind beobachten – ohne Hilfe',value:'nohelp',primary:true},{label:'Nächstes Kind beobachten – mit Beobachtungshilfe',value:'help'},{label:nextLabel(1),value:'next'}]);
    if(nx==='next')break;help=nx==='help';
  }
}

async function observe(type,kid,help){
  const N=kid.n,S=SC.play;
  const mom=mk({kind:'adult',top:'#3f6e8c',hair:'#5a3320',long:true,skin:'#e8c09a',pants:'#2b3245',visible:false});
  const ch=mk({kind:'tod',top:kid.top,hair:kid.hair,skin:'#f1cba5',pants:'#5b6ea6',visible:false});
  const st=mk({kind:'adult',top:'#7d6a4f',hair:'#2a2a2a',long:true,skin:'#c99a74',pants:'#3a3a44',visible:false});
  await cut(S,[mom,ch,st]);
  const nar=async t=>{if(help)await say(null,t);else await wait(2200);};
  const sitAt=(a,x,y,f)=>{a.x=x;a.y=y;a.facing=f;a.state='sit';};

  // Episode 1
  epi('Episode 1 · Mutter und Kind');
  await tweenProp(S,'door',1,700);
  mom.visible=ch.visible=true;mom.x=280;mom.y=122;ch.x=286;ch.y=124;
  await par(walkTo(mom,200,140,26),walkTo(ch,206,146,20));
  bg(tweenProp(S,'door',0,700));
  const e1=bg((async()=>{
    const mw=(async()=>{await walkTo(mom,92,140,28);mom.facing=1;mom.state='sit';mom.chair=true;})();
    if(type==='B'){await walkTo(ch,152,152,20);sitAt(ch,152,152,1);for(let i=0;i<3;i++){await wait(1300);ch.facing=-1;await wait(800);ch.facing=1;}}
    else if(type==='A'){await walkTo(ch,152,152,20);sitAt(ch,152,152,1);await wait(2500);}
    else if(type==='C'){await walkTo(ch,106,146,18);ch.facing=-1;await wait(900);ch.state='armsUp';await wait(1600);ch.state='idle';await wait(900);ch.state='armsUp';}
    else{await walkTo(ch,140,150,20);ch.emote='…';await wait(1800);ch.emote=null;await walkTo(ch,152,152,10);sitAt(ch,152,152,1);}
    await mw;
  })());
  bg(camFollow(ch,1.45,2600));
  await nar({B:`${N} krabbelt zu den Bauklötzen und baut. Immer wieder dreht sich ${N} kurz zur Mutter um – und spielt dann weiter.`,A:`${N} steuert sofort auf die Bauklötze zu. Zur Mutter schaut ${N} kaum.`,C:`${N} bleibt dicht bei der Mutter. Die Spielsachen locken kaum – immer wieder streckt ${N} die Arme nach ihr aus.`,D:`${N} läuft los, bleibt mitten im Raum plötzlich stehen und verharrt reglos. Dann geht es zögerlich weiter.`}[type]);
  await e1;await wait(600);

  // Episode 2
  epi('Episode 2 · Eine fremde Person kommt dazu');
  bg(camReset(1400));
  await tweenProp(S,'door',1,600);st.visible=true;st.x=280;st.y=122;
  await walkTo(st,228,140,24);bg(tweenProp(S,'door',0,600));st.facing=-1;st.state='sit';st.chair=true;
  if(type==='C'){ch.state='idle';}
  const e2=bg((async()=>{
    if(type==='B'){await wait(500);ch.facing=1;ch.emote='?';await wait(1400);ch.emote=null;ch.facing=-1;await wait(1000);ch.facing=1;}
    else if(type==='A'){await wait(2500);}
    else if(type==='C'){ch.emote='!';ch.state='armsUp';await walkTo(ch,100,146,14,{face:false});await wait(1800);ch.emote=null;}
    else{ch.emote='…';await wait(2600);ch.emote=null;}
    st.state='idle';st.chair=false;await walkTo(st,192,147,18);st.facing=-1;
  })());
  await nar({B:`${N} mustert die fremde Frau vorsichtig und blickt zwischendurch zur Mutter. Dann spielt ${N} weiter.`,A:`${N} beachtet die fremde Frau kaum und spielt einfach weiter.`,C:`${N} wirkt beunruhigt und drängt sich noch dichter an die Mutter.`,D:`Als die Fremde hereinkommt, erstarrt ${N}. Der Blick wirkt leer.`}[type]);
  await e2;await wait(500);

  // Episode 3 – Trennung
  epi('Episode 3 · Die Mutter verlässt den Raum');
  mom.state='idle';mom.chair=false;
  await walkTo(mom,270,128,30);await tweenProp(S,'door',1,500);await walkTo(mom,280,122,20);mom.visible=false;bg(tweenProp(S,'door',0,600));
  bg(camFollow(ch,2.1,2400));
  const e3=bg((async()=>{
    if(type==='B'){ch.state='idle';ch.cry=true;await walkTo(ch,248,138,18);ch.facing=1;await wait(700);await walkTo(st,232,140,16);st.facing=1;await wait(2200);}
    else if(type==='A'){ch.facing=1;await wait(700);ch.facing=1;await wait(3000);}
    else if(type==='C'){ch.state='idle';ch.cry=true;ch.jit=1;ch.emote='!';await wait(3200);}
    else{ch.state='idle';await walkTo(ch,206,146,18);await wait(300);ch.facing=-1;ch.emote='…';await wait(3000);}
  })());
  await nar({B:`${N} hört auf zu spielen, läuft zur Tür und weint. Die Fremde kann ${N} nur wenig trösten.`,A:`${N} spielt weiter, als wäre nichts geschehen. Äußerlich wirkt ${N} ruhig.`,C:`${N} schreit heftig und ist völlig aufgelöst. An Spielen ist nicht mehr zu denken.`,D:`${N} läuft Richtung Tür, dreht sich auf halbem Weg um und bleibt wie eingefroren stehen.`}[type]);
  await e3;await wait(500);

  // Episode 4 – Wiedervereinigung
  epi('Episode 4 · Die Mutter kommt zurück');
  bg(camFollow(ch,1.75,1500));
  await tweenProp(S,'door',1,600);mom.visible=true;mom.x=280;mom.y=122;mom.state='idle';
  await walkTo(mom,252,136,26);mom.facing=-1;
  bg((async()=>{await walkTo(st,272,126,22);st.visible=false;await tweenProp(S,'door',0,600);})());
  const e4=bg((async()=>{
    if(type==='B'){await walkTo(ch,244,140,22);ch.state='armsUp';await wait(500);ch.state='idle';ch.attach=mom;await wait(1300);ch.cry=false;ch.emote='♥';await wait(1700);ch.attach=null;ch.emote=null;ch.x=244;ch.y=142;await walkTo(ch,160,152,20);sitAt(ch,160,152,1);await wait(800);}
    else if(type==='A'){ch.facing=1;await wait(700);ch.facing=-1;await wait(900);await walkTo(mom,162,150,28);mom.facing=-1;ch.attach=mom;ch.facing=1;ch.jit=1;await wait(1400);ch.attach=null;ch.jit=0;ch.x=152;ch.y=152;sitAt(ch,152,152,-1);await wait(1400);}
    else if(type==='C'){ch.emote=null;await walkTo(ch,244,140,20);ch.state='armsUp';await wait(600);ch.state='idle';ch.attach=mom;ch.emote='#';await wait(2200);ch.attach=null;ch.x=242;ch.y=142;ch.facing=1;await wait(500);ch.state='armsUp';await wait(1400);}
    else{ch.emote=null;await walkTo(ch,238,140,9,{face:false,facing:-1});ch.emote='…';await wait(1800);ch.emote=null;ch.state='slump';await wait(1800);}
  })());
  await nar({B:`${N} läuft der Mutter entgegen und lässt sich hochnehmen. Nach kurzer Zeit ist ${N} beruhigt – und spielt bald wieder.`,A:`${N} blickt kurz auf und wendet sich dann ab. Auf dem Arm will ${N} gleich wieder herunter.`,C:`${N} will unbedingt auf den Arm – und strampelt sich gleichzeitig wütend weg. ${N} lässt sich lange nicht beruhigen.`,D:`${N} nähert sich der Mutter mit abgewandtem Blick, erstarrt kurz vor ihr und sinkt dann in sich zusammen.`}[type]);
  await e4;await wait(1200);
  epi(null);await fadeOut(1200);
}

async function classify(type,kid){
  const order=['B','A','C','D'];
  const a=await panel(`<div class="kick">Auswertung · ${kid.n}</div><h2>Welcher Bindungstyp?</h2><p>Ordne ${kid.n} auf Grundlage deiner Beobachtung einem Bindungstyp zu.</p>`,order.map(k=>({label:TYPES[k].name,value:k})));
  const b=await panel(`<div class="kick">Begründung</div><h2>Woran hast du das vor allem festgemacht?</h2><p>Welche Beobachtung war für deine Einordnung am aussagekräftigsten?</p>`,[{label:'Am Verhalten bei der Wiedervereinigung',value:'re'},{label:'Daran, wie stark das Kind bei der Trennung weint',value:'cry'},{label:'An der Reaktion auf die fremde Person',value:'str'}]);
  const ok=a===type;C1.done++;if(ok)C1.correct++;ok?goodS():badS();
  const T_=TYPES[type];
  const ind={re:`<div class="note"><b class="good">Gute Begründung.</b> Die Wiedervereinigung gilt als aussagekräftigster Moment: Hier zeigt sich, ob das Kind bei der Bezugsperson Trost und Sicherheit findet.</div>`,
   cry:`<div class="note warn"><b class="bad">Typische Falle:</b> Auch sicher gebundene Kinder weinen bei der Trennung – unsicher-ambivalent gebundene oft noch stärker. Wie stark ein Kind weint, unterscheidet die Typen deshalb nicht eindeutig. Aussagekräftiger ist die <b>Wiedervereinigung</b>.</div>`,
   str:`<div class="note warn"><b class="bad">Nur ein Hinweis.</b> Die Reaktion auf die Fremde liefert Indizien, ist aber nicht das Hauptkriterium. Am aussagekräftigsten ist die <b>Wiedervereinigung</b>: Findet das Kind bei der Bezugsperson Trost?</div>`}[b];
  await panel(`<div class="kick">Rückmeldung</div><div class="verdict ${ok?'good':'bad'}">${ok?'Richtig erkannt.':'Nicht ganz.'}</div><p>${ok?'':'Du hast <b>'+TYPES[a].name+'</b> gewählt. '}${kid.n} zeigte das Muster <b>${T_.name}</b>.</p><table class="tbl"><tr><th>Exploration</th><td>${T_.exp}</td></tr><tr><th>Trennung</th><td>${T_.tr}</td></tr><tr><th>Wiedervereinigung</th><td>${T_.wv}</td></tr><tr><th>Hintergrund</th><td>${T_.hg}</td></tr></table>${ind}`,[{label:'Weiter',primary:true}]);
  unlock('bindung');
}

async function wissenBindung(){
  await panel(`<div class="kick">Wissenskarte</div><h2>Bindung – mehr als Liebe</h2><p><b>Bindung</b> ist nach John Bowlby ein emotional enges, dauerhaftes Band zu einer bestimmten Person, das Schutz und Sicherheit gibt.</p><p>Bindungs- und Erkundungsverhalten funktionieren wie eine <b>Wippe</b>: Fühlt sich das Kind sicher, kann es erkunden. Wird es verunsichert, wird das Bindungsverhalten aktiviert – es sucht Nähe.</p><h3>Nicht nur die Eltern</h3><p>Nach <b>Lieselotte Ahnert</b> bauen Kinder neben primären Bindungen auch <b>sekundäre Bindungen</b> auf, etwa zu Erzieherinnen und Erziehern in der Kita. Verlässliche Zuwendung, Sicherheit, Stressreduktion und Unterstützung beim Erkunden machen den Unterschied.</p><details><summary>Denkfrage: Ist ein vermeidend gebundenes Kind einfach besonders selbstständig?</summary><p>Nein. Es wirkt nur nach außen ruhig. Körperlich zeigt es bei der Trennung deutliche Stressreaktionen. Es hat gelernt, sein Bedürfnis nach Nähe zu verbergen, weil die Bezugsperson darauf oft abweisend reagiert. Echte Selbstständigkeit entsteht eher aus <b>sicherer</b> Bindung.</p></details>`,[{label:'Ins Notizbuch übernehmen',primary:true}]);
  unlock('ahnert');
}

const ST={dif:{n:'Diffuse Identität',d:'keine echte Erkundung, keine Festlegung'},ueb:{n:'Übernommene Identität',d:'Festlegung, ohne selbst erkundet zu haben – oft von Eltern übernommen'},mor:{n:'Moratorium',d:'aktive Erkundung, aber noch keine Festlegung'},era:{n:'Erarbeitete Identität',d:'feste Ziele und Werte nach eigener Erkundung'}};
function statusOf(E,C){const e=E>=4,c=C>=4;return e&&c?'era':e?'mor':c?'ueb':'dif';}
function alexMk(){return mk({kind:'teen',top:'#4a6fa5',hair:'#2b1d14',skin:'#e2b892',pants:'#2d2d3a'});}

async function chapter2(){

  await titleCard('Kapitel II','Wer bin ich?','Alex, 16 Jahre');
  const alex=alexMk();
  let E=0,C=0;const log=[];
  async function decide(domain,prompt,opts){
    const o=shuffle(opts);const i=await choose(prompt,o.map(x=>x.t));const c=o[i];E+=c.e;C+=c.c;log.push({domain,...c});

  }
  alex.x=242;alex.y=134;alex.state='sit';alex.chair=true;alex.facing=-1;alex.phone=true;
  setScene(SC.teen);actors=[alex];cine(true);await fadeIn(1400);
  await panel(`<div class="kick">Deine Rolle</div><h2>Du entscheidest für Alex</h2><p>Der Psychologe <b>James Marcia</b> beschreibt Identität im Jugendalter über zwei Fragen:</p><ul><li><b>Exploration:</b> Setzt sich Alex aktiv mit Möglichkeiten auseinander, probiert aus, hinterfragt?</li><li><b>Verpflichtung:</b> Hat sich Alex auf Ziele und Werte festgelegt?</li></ul><p>Triff vier Entscheidungen. Es gibt dabei kein Richtig oder Falsch. Am Ende ordnest du Alex einem Identitätsstatus zu – ohne die Werte vorher zu sehen.</p>`,[{label:'▶ Los geht’s',primary:true}]);
  bg(camTo(234,110,1.6,7000));
  await say(null,'23:12 Uhr. Morgen ist Berufsinfotag in der Stadthalle.');
  await say('Alex','Alle anderen scheinen genau zu wissen, was sie mal machen wollen …');
  await decide('Beruf','Was denkt Alex über die Berufswahl?',[
    {t:'„Ich schau mir morgen Stände an, die ich noch gar nicht kenne – und frag die Azubis dort aus.“',e:2,c:0,r:'Alex macht sich eine Liste mit Fragen. Es wird spät.'},

  const morph=()=>{if(w.x<80){w.kind='tod';}else if(w.x<160){w.kind='teen';w.top='#4a6fa5';w.pants='#2d2d3a';}else if(w.x<240){w.kind='adult';w.top='#3d5a80';}else{w.kind='elder';w.hair='#cfcfcf';w.cane=true;w.top='#6b5a7a';}};
  const iv=setInterval(morph,100);
  try{
    setScene(SC.dawn);actors=[w];cine(true);bg(camFollow(w,1.35,3000,-14));await fadeIn(1600);
    const walk=bg((async()=>{await walkTo(w,80,150,13);await walkTo(w,160,150,17);await walkTo(w,240,150,17);await walkTo(w,292,150,8);w.facing=-1;})());
    await say(null,'Ein Kind, das bei der Mutter Sicherheit sucht.');
    await say(null,'Ein junger Mensch, der fragt: Wer bin ich?');
    await say(null,'Jemand, der lernt: Ich kann das.');
    await say(null,'Der Entwicklungspsychologe Paul B. Baltes betonte: Entwicklung endet nie. Sie verläuft ein Leben lang – mit Gewinnen und mit Verlusten.');
    await walk;await wait(1200);
  }finally{clearInterval(iv);}
  await fadeOut(1400);
  await panel(`<div class="kick">Wissenskarte</div><h2>Entwicklung über die Lebensspanne</h2><p>Paul B. Baltes beschreibt Entwicklung mit einigen Leitsätzen:</p><ul><li>Entwicklung ist ein <b>lebenslanger</b> Prozess – keine Lebensphase hat Vorrang.</li><li>Sie ist <b>multidirektional</b>: In jedem Alter gibt es Gewinne und Verluste.</li><li>Menschen bleiben <b>plastisch</b>, also veränderbar – in Grenzen.</li><li>Entwicklung ist <b>eingebettet</b> in Kontexte: altersbezogene, geschichtliche und nicht-normative (unvorhersehbare) Einflüsse.</li></ul>`,[{label:'Weiter',primary:true}]);
  unlock('baltes');
  const a=await panel(`<div class="kick">Letzte Frage</div><h2>Welche Entwicklungsaufgabe stand für Alex in Kapitel III im Mittelpunkt?</h2>`,[{label:'Berufliche Kompetenzen aufbauen und sich im Arbeitsleben bewähren',value:'ok'},{label:'Eine sichere Bindung zu einer Bezugsperson aufbauen',value:'b'},{label:'Sich vom Elternhaus ablösen und eine eigene Wohnung finden',value:'c'}]);
  a==='ok'?goodS():badS();
  await panel(`<div class="kick">Ende</div><div class="verdict ${a==='ok'?'good':'bad'}">${a==='ok'?'Richtig.':'Nicht ganz.'}</div><p>Im frühen Erwachsenenalter rückt das <b>Bewähren im Beruf</b> in den Mittelpunkt – eng verknüpft mit Selbstwirksamkeit. Die Ablösung vom Elternhaus spielt ebenfalls eine Rolle, war aber nicht Thema der Präsentationswoche.</p><h3>Deine Reise</h3><p>Kapitel I: ${C1.done?`<b>${C1.correct} von ${C1.done}</b> Kindern richtig zugeordnet`:'noch nicht gespielt'}<br>Notizbuch: <b>${unlocked.size} von ${Object.keys(NB).length}</b> Einträgen</p><p class="dim">Danke fürs Spielen.</p>`,[{label:'Zurück zum Menü',primary:true}]);
}

/* =========================================================
   ABLAUF & MENÜ
   ========================================================= */
let MODE='all';
function nextLabel(n){if(MODE!=='all')return'Zurück zum Menü';return['','Weiter zu Kapitel II','Weiter zu Kapitel III','Weiter zum Epilog'][n];}
function showMenu(on){$('#menu').style.display=on?'flex':'none';}
function goMenu(){abortAll();resetUI();showMeter(false);setScene(SC.title);actors=[];cine(false);setHud('');mood('title');fadeEl.style.transitionDuration='1200ms';fadeEl.style.opacity=0;showMenu(true);}
async function startRun(what){
  abortAll();resetUI();showMenu(false);MODE=what;const my=runId;
  try{
    if(what==='all'){await chapter1();await chapter2();await chapter3();await epilog();}
    else if(what==='1')await chapter1();else if(what==='2')await chapter2();else if(what==='3')await chapter3();else await epilog();
    if(runId===my)goMenu();
  }catch(e){if(e!==ABORT){console.error(e);goMenu();}}
}
document.querySelectorAll('#menu button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();clickS();startRun(b.dataset.run);}));
$('#bMenu').addEventListener('click',e=>{e.stopPropagation();goMenu();});
$('#bNb').addEventListener('click',e=>{e.stopPropagation();openNb();});
$('#bSnd').addEventListener('click',e=>{e.stopPropagation();AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?.55:0;e.target.textContent='Ton: '+(AU.on?'an':'aus');});
$('#stage').addEventListener('click',()=>{if(advance)advance();});
document.addEventListener('keydown',e=>{
  if($('#nb').style.display==='flex'){if(e.key==='Escape')$('#nb').style.display='none';return;}
  const P=$('#panel');
  if(P.style.display==='flex'){const bs=P.querySelectorAll('.btn');const n=parseInt(e.key,10);if(n>=1&&n<=bs.length){bs[n-1].click();e.preventDefault();}else if((e.key==='Enter'||e.key===' ')&&bs.length===1){bs[0].click();e.preventDefault();}return;}
  if(keyChoice){const n=parseInt(e.key,10);if(n>=1){keyChoice(n-1);e.preventDefault();}return;}
  if(e.key===' '||e.key==='Enter'){if(advance){advance();e.preventDefault();}}
});
$('#splash').addEventListener('click',e=>{e.stopPropagation();au();if(AU.ac&&AU.ac.state==='suspended')AU.ac.resume();$('#splash').style.display='none';goMenu();});
setScene(SC.title);
function frame(ts){
  T=ts;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(scene){scene.draw(T);actors.forEach(updActor);actors.filter(a=>a.visible).sort((a,b)=>a.y-b.y).forEach(drawPerson);if(scene.fg)scene.fg(T);}
  camDraw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
